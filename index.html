  /* ----------------------------------------------------------------------
   * engine — tick orkestrasyonu (deterministik faz sırası)
   * -------------------------------------------------------------------- */
  const PHASES = ['market', 'economy', 'laundering', 'crime', 'world', 'agency', 'ai', 'psychology', 'crew', 'mole', 'diplomacy', 'corruption', 'prison', 'dynasty', 'achievement'];   // her tick (=1 ay)
  const YEARLY = ['aging', 'rank', 'worldEconomyYear'];               // yılda bir

  function tick(state) {
    const rng = util.makeRng(state.rngState);   // save'den birebir devam
    for (const phase of PHASES) systems[phase](state, rng);
    advanceClock(state);
    state.rngState = rng.state;                  // ilerlemiş durumu geri yaz
    return state;
  }

  function advanceClock(state) {
    state.clock.tick += 1;
    state.clock.month += 1;
    if (state.clock.month > rules.monthsPerYear) { state.clock.month = 1; state.clock.year += 1; }
  }

  // "Yaş Al (+1 Yıl)": 12 ayı simüle eder, ardından yıllık sistemleri çalıştırır
  function advanceYear(state) {
    for (let i = 0; i < rules.monthsPerYear; i++) tick(state);
    const rng = util.makeRng(state.rngState);
    for (const phase of YEARLY) systems[phase](state, rng);
    // yaşlılıktan ölen patron için succession'ı aynı yıl işle
    systems.dynasty(state, rng);
    systems.achievement(state, rng);
    // zirve servet kaydı (dynasty chronicle için)
    const pf = playerFamily(state);
    if (pf) { const ch = state.dynasty.history[state.dynasty.history.length - 1]; if (ch) ch.peakWealth = Math.max(ch.peakWealth || 0, totalMoney(pf)); }
    state.rngState = rng.state;
    return state;
  }

  function run(state, ticks) { for (let i = 0; i < ticks; i++) tick(state); return state; }

  // Oyuncunun patronu hapiste mi? (UI ana döngüyü duraklatıp hapis ekranına geçer)
  function isInPrison(state) { const b = state.characters[state.dynasty.bossId]; return !!(b && b.isArrested); }
  const engine = { tick, run, advanceYear, isInPrison, PHASES, YEARLY };

  /* ----------------------------------------------------------------------
   * persist — Save/Load (LocalStorage) + checksum + migration
   * -------------------------------------------------------------------- */
  const KEY_PREFIX = 'ahtapot:save:';

  const MemoryAdapter = (() => { const m = {}; return {
    get: k => (k in m ? m[k] : null), set: (k, v) => { m[k] = v; }, remove: k => { delete m[k]; },
    keys: () => Object.keys(m),
  }; })();

  function LocalStorageAdapter() {
    const ls = (typeof root.localStorage !== 'undefined') ? root.localStorage : null;
    if (!ls) return MemoryAdapter; // Node/SSR ortamında otomatik fallback
    return {
      get: k => ls.getItem(k), set: (k, v) => ls.setItem(k, v), remove: k => ls.removeItem(k),
      keys: () => Object.keys(ls).filter(k => k.indexOf(KEY_PREFIX) === 0),
    };
  }

  // Şema migration'ları: hedef-versiyon → dönüştürücü
  const migrations = {
    // v1 → v2: karakter öznitelik/psikoloji/beceri + aile ekol/rütbe/konum + ay-takvim
    2: s => {
      if (s.clock && s.clock.day != null && s.clock.month == null) { s.clock.month = 1; delete s.clock.day; }
      if (s.pendingEvent === undefined) s.pendingEvent = null;
      Object.values(s.families || {}).forEach(f => {
        if (f.school == null) f.school = 'italian';
        if (f.rank == null) f.rank = 0;
        if (f.country == null) f.country = data.countries[0];
        if (f.city == null) f.city = data.citiesByCountry[f.country][0];
      });
      Object.values(s.characters || {}).forEach(c => {
        if (!c.skills) c.skills = c.stats ? Object.assign({ hacking: 10 }, c.stats) : { combat: 30, cunning: 30, charisma: 30, loyalty: 30, management: 30, hacking: 10 };
        if (!c.attributes) c.attributes = { health: c.health != null ? c.health : 100, happiness: 60, intelligence: 40, looks: 40, reputation: 15 };
        if (!c.vitals) c.vitals = { energy: 100, heat: 0, paranoia: 5 };
        if (!c.psyche) c.psyche = { conscience: 50, trauma: 0, stress: 25, addiction: 0 };
      });
      return s;
    },
    // v2 → v3: ekip (job/courage/greed), köstebek (isMole/moleRisk/suspicion), diplomasi (armedMen/relations)
    3: s => {
      Object.values(s.families || {}).forEach(f => {
        if (f.armedMen == null) f.armedMen = f.isPlayer ? 3 : 10;
        if (f.archetype == null) f.archetype = f.aiProfile ? f.aiProfile.archetype : null;
        if (!f.relations) f.relations = {};
      });
      // başlangıç ilişki ağı (yoksa)
      const fams = Object.values(s.families || {});
      fams.forEach(a => fams.forEach(b => { if (a.id !== b.id && !a.relations[b.id]) a.relations[b.id] = { standing: 0, treaty: 'peace' }; }));
      Object.values(s.characters || {}).forEach(c => {
        if (c.courage == null) c.courage = 50;
        if (c.greed == null) c.greed = 40;
        if (c.job == null) c.job = 'none';
        if (c.isMole == null) c.isMole = false;
        if (c.moleRisk == null) c.moleRisk = 0;
        if (c.suspicion == null) c.suspicion = 0;
      });
      return s;
    },
    // v3 → v4: kaçak ticaret envanteri, yozlaşma, piyasa malları, işletme alanları
    4: s => {
      if (!s.market) s.market = { goods: {}, trends: { policePressure: 0.2, economy: 0.5 } };
      if (!s.market.trends) s.market.trends = { policePressure: 0.2, economy: 0.5 };
      if (s.market.trends.economy == null) s.market.trends.economy = 0.5;
      if (s.market.trends.policePressure == null) s.market.trends.policePressure = 0.2;
      if (!s.market.goods) s.market.goods = {};
      data.goods.forEach(g => { if (!s.market.goods[g.id]) s.market.goods[g.id] = { price: g.base, base: g.base, supply: 1, demand: 1, vol: g.vol }; });
      Object.values(s.families || {}).forEach(f => {
        if (!f.inventory) f.inventory = {};
        if (!f.corruption) f.corruption = { mayor: false, prosecutor: false, policeChief: false, judge: false, minister: false };
      });
      Object.values(s.businesses || {}).forEach(b => {
        const bt = data.businessTypes.find(t => t.id === b.type) || {};
        if (b.staffCost == null) b.staffCost = bt.staff != null ? bt.staff : 200;
        if (b.auditRisk == null) b.auditRisk = bt.audit != null ? bt.audit : 0.05;
        if (b.efficiency == null) b.efficiency = bt.eff != null ? bt.eff : 0.82;
      });
      return s;
    },
    // v4 → v5: federal istihbarat alanları + hapishane RPG durumu
    5: s => {
      Object.values(s.families || {}).forEach(f => {
        if (f.federalHeat == null) f.federalHeat = 0;
        if (f.smuggleVolume == null) f.smuggleVolume = 0;
        if (f.wiretapTicks == null) f.wiretapTicks = 0;
        if (f.redNotice == null) f.redNotice = false;
      });
      Object.values(s.characters || {}).forEach(c => {
        if (c.isArrested == null) c.isArrested = (c.status === 'jailed');
        if (c.prison === undefined) c.prison = null;
      });
      return s;
    },
    // v5 → v6: hanedan/soy alanları, istatistik sayaçları, başarım kaydı, sürgün
    6: s => {
      if (!s.dynasty) s.dynasty = { bossId: null, heirs: [], generation: 1, legacyPoints: 0, perks: [], history: [], collapsed: false };
      if (s.dynasty.collapsed == null) s.dynasty.collapsed = false;
      if (!s.achievements) s.achievements = { unlocked: {} };
      if (!s.stats) s.stats = { assassinations: 0, warsWon: 0, escapes: 0, prisonFightsWon: 0, molesCaught: 0, children: 0, peakWealth: 0 };
      Object.values(s.families || {}).forEach(f => { if (f.inExile == null) f.inExile = false; });
      Object.values(s.characters || {}).forEach(c => {
        if (c.spouseId === undefined) c.spouseId = null;
        if (!c.childrenIds) c.childrenIds = [];
        if (!c.parentIds) c.parentIds = [];
      });
      return s;
    },
  };

  function runMigrations(state) {
    while (state.meta.version < CURRENT_VERSION) {
      const fn = migrations[state.meta.version + 1];
      if (!fn) { state.meta.version = CURRENT_VERSION; break; }
      state = fn(state);
      state.meta.version += (state.meta.version < CURRENT_VERSION ? 1 : 0);
    }
    return state;
  }

  function serialize(state) {
    const json = JSON.stringify(state);
    return JSON.stringify({ version: state.meta.version, checksum: util.fnv1a(json), savedAt: Date.now(), state: json });
  }

  function deserialize(envelopeStr) {
    const env = JSON.parse(envelopeStr);
    if (util.fnv1a(env.state) !== env.checksum) throw new Error('Save bozuk: checksum uyuşmuyor');
    let state = JSON.parse(env.state);
    return runMigrations(state);
  }

  function save(slot, state, adapter) {
    adapter = adapter || LocalStorageAdapter();
    adapter.set(KEY_PREFIX + slot, serialize(state));
    return true;
  }

  function load(slot, adapter) {
    adapter = adapter || LocalStorageAdapter();
    const raw = adapter.get(KEY_PREFIX + slot);
    if (!raw) return null;
    return deserialize(raw);
  }

  function listSaves(adapter) {
    adapter = adapter || LocalStorageAdapter();
    return adapter.keys().map(k => k.replace(KEY_PREFIX, ''));
  }

  function exportSave(state) { return serialize(state); }
  function importSave(str) { return deserialize(str); }

  const persist = { save, load, listSaves, exportSave, importSave, serialize, deserialize, runMigrations, LocalStorageAdapter, MemoryAdapter, CURRENT_VERSION };

  /* ----------------------------------------------------------------------
   * events — hafif EventBus (UI faz 3'te abone olacak)
   * -------------------------------------------------------------------- */
  const events = (() => {
    const map = {};
    return {
      on(type, fn) { (map[type] = map[type] || []).push(fn); return () => this.off(type, fn); },
      off(type, fn) { if (map[type]) map[type] = map[type].filter(f => f !== fn); },
      emit(type, payload) { (map[type] || []).forEach(fn => fn(payload)); },
    };
  })();

  /* ----------------------------------------------------------------------
   * test — gömülü self-test harness (determinizm + save round-trip)
   * -------------------------------------------------------------------- */
  function selfTest() {
    const results = [];
    const check = (name, cond) => { results.push({ name, ok: !!cond }); };

    // 1) RNG determinizmi
    const r1 = util.makeRng(7), r2 = util.makeRng(7);
    const seq1 = [r1.next(), r1.next(), r1.next()], seq2 = [r2.next(), r2.next(), r2.next()];
    check('RNG aynı seed → aynı dizi', JSON.stringify(seq1) === JSON.stringify(seq2));

    // 2) Aynı seed → aynı dünya (50 tick sonra birebir)
    const a = run(createNewGame(123, { now: 1000 }), 50);
    const b = run(createNewGame(123, { now: 1000 }), 50);
    check('Simülasyon determinizmi (50 tick)', JSON.stringify(a) === JSON.stringify(b));

    // 3) Farklı seed → farklı dünya
    const c = run(createNewGame(999, { now: 1000 }), 50);
    check('Farklı seed → farklı dünya', JSON.stringify(a) !== JSON.stringify(c));

    // 4) Save/Load round-trip (MemoryAdapter)
    const g = createNewGame(42, { now: 2000 });
    run(g, 25);
    persist.save('test', g, MemoryAdapter);
    const loaded = persist.load('test', MemoryAdapter);
    check('Save/Load round-trip eşit', JSON.stringify(g) === JSON.stringify(loaded));

    // 5) Yüklenen oyun aynı şekilde devam eder (determinizm save sonrası korunur)
    const contA = run(JSON.parse(JSON.stringify(loaded)), 20);
    const contB = run(g, 20);
    check('Load sonrası devam determinizmi', JSON.stringify(contA) === JSON.stringify(contB));

    // 6) Checksum bozulmasını yakalar
    let caught = false;
    try { persist.deserialize('{"version":1,"checksum":"deadbeef","state":"{}"}'); } catch (e) { caught = true; }
    check('Bozuk save checksum ile reddedilir', caught);

    // 7) Yaşayan dünya gerçekten ilerliyor
    const live = createNewGame(5, { now: 3000 });
    run(live, 40);
    check('Saat ilerledi', live.clock.tick === 40);
    check('Dünya olay üretti (haber akışı doldu)', live.world.newsFeed.length > 1);

    // 8) Başlangıç senaryosu: 14 yaş + bekleyen 3 seçenekli olay
    const s8 = createNewGame(77, { now: 4000 });
    const boss8 = s8.characters[s8.dynasty.bossId];
    check('Oyuncu 14 yaşında başlar', boss8.age === rules.startAge);
    check('Başlangıç olayı 3 seçenekli', !!s8.pendingEvent && s8.pendingEvent.options.length === 3);

    // 9) Seçim dünyayı dallandırır ve olayı temizler
    const sRob = createNewGame(77, { now: 4000 }); applyStartChoice(sRob, 'rob');
    const sPol = createNewGame(77, { now: 4000 }); applyStartChoice(sPol, 'police');
    check('Karar pendingEvent temizler', sRob.pendingEvent === null);
    check('Farklı seçim farklı yol üretir', JSON.stringify(sRob.flags) !== JSON.stringify(sPol.flags));

    // 10) Yıllık döngü: yaş ilerler, takvim yıl atar
    const sy = createNewGame(11, { now: 5000 });
    const age0 = sy.characters[sy.dynasty.bossId].age;
    engine.advanceYear(sy);
    check('advanceYear yılı ilerletir', sy.clock.year === 2);
    check('advanceYear yaşı artırır', sy.characters[sy.dynasty.bossId].age === age0 + 1);

    // 11) advanceYear determinizmi
    const ya = createNewGame(33, { now: 6000 }); for (let i = 0; i < 5; i++) engine.advanceYear(ya);
    const yb = createNewGame(33, { now: 6000 }); for (let i = 0; i < 5; i++) engine.advanceYear(yb);
    check('advanceYear determinizmi (5 yıl)', JSON.stringify(ya) === JSON.stringify(yb));

    // 12) Uzun vadede ölüm gerçekleşir (yaşlanma çalışıyor; succession otomatik devralır)
    const old = createNewGame(8, { now: 7000 });
    const origBoss = old.dynasty.bossId;
    old.characters[origBoss].age = 70;
    let died = false;
    for (let i = 0; i < 25 && !died; i++) { engine.advanceYear(old); if (old.characters[origBoss].status === 'dead') died = true; }
    check('Yaşlılıkta ölüm gerçekleşir', died);

    // 13) Ekol modifier'ı uygulanıyor (Kartel kirli gelir > İtalyan)
    const cartel = run(createNewGame(101, { now: 8000, school: 'cartel' }), 12);
    const italian = run(createNewGame(101, { now: 8000, school: 'italian' }), 12);
    check('Suç ekolü ekonomiyi etkiler', cartel.families && italian.families &&
      JSON.stringify(playerFamily(cartel).school) !== JSON.stringify(playerFamily(italian).school));

    // 14) v1 save migration v2'ye yükselir
    const v1env = JSON.stringify({ version: 1, checksum: '', state: '' });
    const v1state = { meta: { version: 1, seed: 1, createdAt: 0, saveName: 'x', nextId: 5 }, clock: { tick: 3, day: 10, year: 1 }, families: { f1: { id: 'f1', isPlayer: true, cleanMoney: 1, dirtyMoney: 0, reputation: 5, heat: 0, memberIds: ['c1'], territoryIds: [], businessIds: [], relations: {} } }, characters: { c1: { id: 'c1', familyId: 'f1', name: 'X', role: 'BOSS', stats: { combat: 40, cunning: 40, charisma: 40, loyalty: 40, management: 40 }, age: 30, health: 90, status: 'active', relations: {} } }, territories: {}, operations: {}, businesses: {}, market: { goods: {}, trends: {} }, world: { newsFeed: [] }, dynasty: { bossId: 'c1', history: [] }, eventLog: [], flags: {} };
    const migrated = persist.runMigrations(JSON.parse(JSON.stringify(v1state)));
    check('Migration v1→v6 alanları doldurur', migrated.meta.version === 6 && migrated.clock.month === 1 &&
      !!migrated.characters.c1.vitals && !!migrated.families.f1.school &&
      migrated.families.f1.armedMen != null && migrated.characters.c1.job === 'none' && !!migrated.families.f1.relations &&
      !!migrated.families.f1.inventory && !!migrated.families.f1.corruption && !!migrated.market.goods.weapon &&
      migrated.families.f1.federalHeat != null && migrated.characters.c1.isArrested != null && migrated.characters.c1.prison === null &&
      !!migrated.achievements && !!migrated.stats && migrated.families.f1.inExile === false && Array.isArray(migrated.characters.c1.childrenIds));

    // 15) 6 isimli rakip aile sabit kadro
    const s15 = createNewGame(1, { now: 1 });
    const names15 = Object.values(s15.families).map(f => f.name);
    check('6 isimli rakip aile mevcut', ['Romano Family', 'Volkov Bratva', 'Crimson Triad', 'Los Santos Cartel', 'Black Lotus', 'Iron Syndicate'].every(n => names15.includes(n)));

    // 16) Ekip: işe alım + pozisyon atama
    const s16 = createNewGame(2, { now: 2 }); applyStartChoice(s16, 'gang');
    const before16 = playerFamily(s16).memberIds.length;
    const hireRes = commands.hire(s16, { job: 'lawyer' });
    check('İşe alım çalışır', hireRes.ok && playerFamily(s16).memberIds.length === before16 + 1);
    check('Pozisyon atanır', hireRes.ok && s16.characters[hireRes.memberId].job === 'lawyer');

    // 17) Ekip limiti rütbeye göre uygulanır
    const s17 = createNewGame(3, { now: 3 }); playerFamily(s17).cleanMoney = 10000000;
    let hitLimit = false;
    for (let i = 0; i < 40; i++) { const r = commands.hire(s17, {}); if (!r.ok && r.reason === 'limit') { hitLimit = true; break; } }
    check('Ekip limiti uygulanır', hitLimit);

    // 18) Köstebek: düşük sadakat + açgözlülük → arka planda köstebekleşme
    const s18 = createNewGame(4, { now: 4 });
    const m18 = familyMembers(s18, playerFamily(s18)).find(c => c.role !== 'BOSS');
    m18.skills.loyalty = 3; m18.greed = 95; m18.psyche.stress = 85;
    const rng18 = util.makeRng(123); let became = false;
    for (let i = 0; i < 250 && !became; i++) { moleSystem.update(s18, rng18); if (m18.isMole) became = true; }
    check('Düşük sadakatte köstebek oluşur', became && m18.moleRisk > 0);

    // 19) Sustur (infaz) köstebeği ortadan kaldırır
    const s19 = createNewGame(5, { now: 5 });
    const v19 = familyMembers(s19, playerFamily(s19)).find(c => c.role !== 'BOSS'); v19.isMole = true;
    const sil = commands.silence(s19, v19.id);
    check('Sustur infaz eder', sil.ok && v19.status === 'dead' && sil.wasMole === true);

    // 20) Diplomasi: savaş ilanı çift yönlü treaty kurar
    const s20 = createNewGame(6, { now: 6 });
    const rid20 = Object.keys(s20.families).find(id => !s20.families[id].isPlayer);
    commands.declareWar(s20, rid20);
    const pf20 = playerFamily(s20);
    check('Savaş ilanı iki yönlü treaty', relationOf(pf20, rid20).treaty === 'war' && relationOf(s20.families[rid20], pf20.id).treaty === 'war');

    // 21) Savaş çözümü deterministik
    const ba = createNewGame(7, { now: 7 }), bb = createNewGame(7, { now: 7 });
    const ridA = Object.keys(ba.families).find(id => !ba.families[id].isPlayer);
    commands.territoryWar(ba, ridA); commands.territoryWar(bb, ridA);
    check('Savaş çözümü deterministik', JSON.stringify(ba) === JSON.stringify(bb));

    // 22) Casusluk sonuç döndürür
    const s22 = createNewGame(8, { now: 8 });
    const rid22 = Object.keys(s22.families).find(id => !s22.families[id].isPlayer);
    const esp = commands.espionage(s22, rid22);
    check('Casusluk sonuç döner', esp.ok && typeof esp.success === 'boolean');

    // 23) Genişletilmiş tick (8 faz) hâlâ deterministik
    const fa = run(createNewGame(303, { now: 9 }), 24), fb = run(createNewGame(303, { now: 9 }), 24);
    check('Genişletilmiş tick determinizmi (8 faz)', JSON.stringify(fa) === JSON.stringify(fb));

    // 24) Dinamik piyasa: fiyatlar dalgalanır
    const mk = createNewGame(404, { now: 10 }); const p0 = mk.market.goods.cryptotape.price;
    run(mk, 30); check('Piyasa fiyatı dalgalanır', mk.market.goods.cryptotape.price !== p0);

    // 25) Kaçak ticaret: al/sat envanter + kirli para döngüsü
    const tr = createNewGame(505, { now: 11 }); const pft = playerFamily(tr); pft.dirtyMoney = 200000; pft.heat = 0;
    const buy = commands.buyGood(tr, 'art', 2);
    check('Mal alımı envantere ekler', buy.ok && (playerFamily(tr).inventory.art || 0) === 2);
    const sell = commands.sellGood(tr, 'art', 2);
    check('Mal satışı stoğu düşürür', sell.ok && (playerFamily(tr).inventory.art || 0) === 0);

    // 26) Kara para aklama kirli→temiz dönüştürür
    const la = createNewGame(606, { now: 12 }); const pfl = playerFamily(la); pfl.dirtyMoney = 50000; pfl.cleanMoney = 0;
    const dirty0 = pfl.dirtyMoney, clean0 = pfl.cleanMoney;
    systems.laundering(la, util.makeRng(1));
    check('Aklama kirli parayı azaltır', playerFamily(la).dirtyMoney < dirty0);
    check('Aklama temiz parayı artırır', playerFamily(la).cleanMoney > clean0);

    // 27) Siyasi yozlaşma: rüşvet figür satın alır, seviye yükselir
    const co = createNewGame(707, { now: 13 }); playerFamily(co).cleanMoney = 500000;
    const br = commands.bribe(co, 'policeChief');
    check('Rüşvet figür satın alır', br.ok && playerFamily(co).corruption.policeChief === true && corruptionLevel(playerFamily(co)) > 0);

    // 28) Yozlaşma aranma seviyesini (heat) bastırır
    const hs = createNewGame(808, { now: 14 }); const pfh = playerFamily(hs); pfh.cleanMoney = 1000000; pfh.heat = 80;
    commands.bribe(hs, 'minister'); commands.bribe(hs, 'policeChief');
    const h0 = playerFamily(hs).heat; systems.corruption(hs, util.makeRng(2));
    check('Yozlaşma ısıyı bastırır', playerFamily(hs).heat < h0);

    // 29) Mahkeme: hakim/savcı ile dosya kapanır (tahliye)
    const ct = createNewGame(909, { now: 15 }); const pfj = playerFamily(ct); pfj.cleanMoney = 1000000;
    commands.bribe(ct, 'judge'); commands.bribe(ct, 'prosecutor');
    const jm = familyMembers(ct, pfj).find(c => c.role !== 'BOSS'); jm.status = 'jailed';
    let released = false; const rngc = util.makeRng(5);
    for (let i = 0; i < 200 && !released; i++) { systems.corruption(ct, rngc); if (jm.status === 'active') released = true; }
    check('Yozlaşma ile tahliye mümkün', released);

    // 30) İşletme satın alma yeni aklama cephesi açar
    const biz = createNewGame(111, { now: 16 }); const pfz = playerFamily(biz); pfz.cleanMoney = 200000;
    const nb0 = pfz.businessIds.length, bres = commands.buyBusiness(biz, 'casino');
    check('İşletme satın alma çalışır', bres.ok && playerFamily(biz).businessIds.length === nb0 + 1);

    // 31) Makro ekonomi olayı trendi değiştirir
    const mac = createNewGame(222, { now: 17 }); const e0 = mac.market.trends.economy;
    let changed = false; for (let i = 0; i < 8 && !changed; i++) { engine.advanceYear(mac); if (mac.market.trends.economy !== e0) changed = true; }
    check('Makro olay ekonomiyi değiştirir', changed);

    // 32) Genişletilmiş tick (11 faz) deterministik
    const ea = run(createNewGame(333, { now: 18 }), 24), eb = run(createNewGame(333, { now: 18 }), 24);
    check('11 fazlı tick determinizmi', JSON.stringify(ea) === JSON.stringify(eb));

    // 33) Federal: yüksek yozlaşma + kaçakçılık federal ısıyı biriktirir
    const fed = createNewGame(1212, { now: 20 }); const pf33 = playerFamily(fed);
    pf33.cleanMoney = 3000000; ['mayor', 'prosecutor', 'policeChief', 'judge', 'minister'].forEach(o => commands.bribe(fed, o));
    pf33.smuggleVolume = 800; pf33.heat = 60;
    const rngf = util.makeRng(9); for (let i = 0; i < 15; i++) systems.agency(fed, rngf);
    check('Federal ısı birikir', playerFamily(fed).federalHeat > 0);

    // 34) Federal baskın policeChief'i bypass eder, temiz banka parasına el koyar
    const fz = createNewGame(1313, { now: 21 }); const pf34 = playerFamily(fz);
    pf34.cleanMoney = 1000000; pf34.corruption.policeChief = true; pf34.federalHeat = 95;
    const clean0_34 = pf34.cleanMoney; const rngz = util.makeRng(3);
    let frozen = false; for (let i = 0; i < 30 && !frozen; i++) { systems.agency(fz, rngz); if (playerFamily(fz).cleanMoney < clean0_34) frozen = true; }
    check('Federal varlık dondurma (policeChief bypass)', frozen);

    // 35) Tutuklama isArrested + hapis durumu kurar
    const ar = createNewGame(1414, { now: 22 }); const bossA = ar.characters[ar.dynasty.bossId];
    arrest(ar, util.makeRng(1), bossA, 6);
    check('Tutuklama hapis durumu kurar', bossA.isArrested === true && !!bossA.prison && bossA.status === 'jailed');

    // 36) Hapis tick'i cezayı azaltır ve süre dolunca tahliye eder
    const prr = createNewGame(1515, { now: 23 }); const bp = prr.characters[prr.dynasty.bossId];
    arrest(prr, util.makeRng(1), bp, 3);
    for (let i = 0; i < 5; i++) systems.prison(prr, util.makeRng(100 + i));
    check('Ceza dolunca tahliye', bp.isArrested === false && bp.status === 'active');

    // 37) Mahkum devşirme çıkışta ekibe katar
    const rc = createNewGame(1616, { now: 24 }); const bc = rc.characters[rc.dynasty.bossId]; const pf37 = playerFamily(rc);
    arrest(rc, util.makeRng(1), bc, 2); bc.skills.charisma = 99; bc.prison.respect = 80;
    let recruitId = null; for (let i = 0; i < 25 && !recruitId; i++) { const r = commands.prisonRecruit(rc); if (r.recruited) recruitId = r.recruitId; }
    for (let i = 0; i < 5; i++) systems.prison(rc, util.makeRng(200 + i));
    check('Devşirilen mahkum tahliyede ekibe katılır', !!recruitId && playerFamily(rc).memberIds.includes(recruitId));

    // 38) Ring dövüşü hapis durumunu etkiler
    const rf = createNewGame(1818, { now: 26 }); const br2 = rf.characters[rf.dynasty.bossId];
    arrest(rf, util.makeRng(1), br2, 10);
    const respect0 = br2.prison.respect, health0 = br2.attributes.health;
    commands.prisonFight(rf);
    check('Ring dövüşü etki eder', br2.prison.respect !== respect0 || br2.attributes.health !== health0);

    // 39) Gardiyan rüşveti hücre konforunu artırır
    const gb = createNewGame(1919, { now: 27 }); const bg = gb.characters[gb.dynasty.bossId]; playerFamily(gb).cleanMoney = 100000;
    arrest(gb, util.makeRng(1), bg, 10);
    const comfort0 = bg.prison.comfort; commands.prisonBribeGuard(gb);
    check('Gardiyan rüşveti konforu artırır', bg.prison.comfort > comfort0);

    // 40) Firar planı tahliye sağlayabilir
    const es = createNewGame(1717, { now: 25 }); const be = es.characters[es.dynasty.bossId]; playerFamily(es).cleanMoney = 100000;
    arrest(es, util.makeRng(1), be, 20); be.attributes.intelligence = 99; be.courage = 99;
    commands.prisonBribeGuard(es);
    let escaped = false; for (let i = 0; i < 50 && !escaped; i++) { const r = commands.prisonEscape(es, 'tunnel'); if (r.escaped) escaped = true; }
    check('Firar planı çalışır', escaped && be.isArrested === false);

    // 41) Genişletilmiş tick (15 faz) deterministik
    const ga = run(createNewGame(444, { now: 28 }), 24), gbq = run(createNewGame(444, { now: 28 }), 24);
    check('15 fazlı tick determinizmi', JSON.stringify(ga) === JSON.stringify(gbq));

    // 42) Evlilik + çocuk (varis genetiği)
    const dy = createNewGame(2020, { now: 30 });
    commands.marry(dy);
    const childRes = commands.haveChild(dy);
    check('Evlilik + çocuk doğar', childRes.ok && !!childRes.childId && dy.stats.children === 1);
    const child = dy.characters[childRes.childId];
    check('Çocuk genetik + özellik taşır', child.parentIds.length === 2 && child.traits.length === 1 && child.status === 'child');

    // 43) Çocuk reşit olunca aktif olur (aging)
    const gr = createNewGame(2121, { now: 31 }); commands.marry(gr); const cr = commands.haveChild(gr).childId;
    for (let i = 0; i < 17; i++) engine.advanceYear(gr);
    check('Çocuk reşit olunca aktifleşir', gr.characters[cr] && gr.characters[cr].status === 'active' && gr.characters[cr].age >= rules.childAdultAge);

    // 44) Succession: patron ölünce varis devralır, nesil artar
    const su = createNewGame(2222, { now: 32 });
    const heir = familyMembers(su, playerFamily(su)).find(c => c.role !== 'BOSS' && c.age >= 16);
    commands.setHeir(su, heir.id);
    const oldBossId = su.dynasty.bossId; const gen0 = su.dynasty.generation;
    su.characters[oldBossId].status = 'dead'; su.flags.successionPending = 1;
    systems.dynasty(su, util.makeRng(1));
    check('Succession varisi tahta geçirir', su.dynasty.bossId === heir.id && su.characters[heir.id].role === 'BOSS' && su.dynasty.generation === gen0 + 1);

    // 45) Varis yoksa hanedan çöker (game over)
    const cl = createNewGame(2323, { now: 33 });
    familyMembers(cl, playerFamily(cl)).forEach(c => { if (c.role !== 'BOSS') c.status = 'dead'; });
    cl.characters[cl.dynasty.bossId].status = 'dead'; cl.flags.successionPending = 1;
    systems.dynasty(cl, util.makeRng(1));
    check('Varis yoksa hanedan çöker', cl.dynasty.collapsed === true && cl.flags.gameOver === 1);

    // 46) Uluslararası kaçış: ülke değişir, sürgün + ısı düşer
    const ec = createNewGame(2424, { now: 34 }); const pfe = playerFamily(ec);
    pfe.cleanMoney = 100000; pfe.heat = 80; pfe.redNotice = false;
    const fl = commands.fleeCountry(ec, 'Dubai');
    check('Kaçış ülke değiştirir + sürgün', fl.ok && !fl.caught && playerFamily(ec).country === 'Dubai' && playerFamily(ec).inExile === true && playerFamily(ec).heat < 80);

    // 47) Başarım sistemi 100+ başarım içerir ve kilit açar
    check('100+ başarım tanımlı', data.achievements.length >= 100);
    const ac = createNewGame(2525, { now: 35 }); playerFamily(ac).cleanMoney = 20000;
    systems.achievement(ac, util.makeRng(1));
    check('Servet başarımı açılır', ac.achievements.unlocked['wealth_10000'] != null);

    // 48) Dynasty Score hesaplanır
    const ds = createNewGame(2626, { now: 36 });
    check('Dynasty Score sayısal', typeof dynastyScore(ds) === 'number' && dynastyScore(ds) >= 0);

    // 49) Save/Load round-trip yeni alanlarla bozulmaz
    const sv = createNewGame(2727, { now: 37 }); commands.marry(sv); commands.haveChild(sv); run(sv, 12);
    persist.save('v6', sv, MemoryAdapter); const lo = persist.load('v6', MemoryAdapter);
    check('v6 save/load round-trip', JSON.stringify(sv) === JSON.stringify(lo));

    const passed = results.filter(r => r.ok).length;
    const total = results.length;
    const log = (typeof console !== 'undefined') ? console : { log: () => {} };
    log.log('%cAHTAPOT self-test: ' + passed + '/' + total, passed === total ? 'color:#6fbf73' : 'color:#d9534f');
    results.forEach(r => log.log((r.ok ? '  ✓ ' : '  ✗ ') + r.name));
    return { passed, total, ok: passed === total, results };
  }

  /* ----------------------------------------------------------------------
   * Public API
   * -------------------------------------------------------------------- */
  root.AHTAPOT = {
    version: '0.7-dynasty-succession-escape-achievements',
    util, rules, data, model,
    state: {
      createNewGame, applyStartChoice, CURRENT_VERSION, playerFamily,
      helpers: { familyMembers, busyCrew, totalMoney, schoolMod, rankFor, rankName, crewAttrs, crewLimit, jobName, familyPower, avgLoyalty, relationOf, alliesOf, isEmbargoed, corruptionLevel, cityFactor, catFactor, isInPrison, playerArrestedBoss, dynastyScore, findHeir },
    },
    story, systems, engine, persist, events, commands,
    crewSystem, moleSystem, diplomacySystem, agencySystem, prisonSystem, dynastySystem, achievementSystem,
    test: { selfTest },
  };
})();
</script>

<script id="ahtapot-ui">
/* =========================================================================
 * AHTAPOT — Faz 3 Mobil UI (Cyber Crimson / Mafia Noir)
 * Vanilla DOM render + view manager. Çekirdeğe yalnız public API/commands ile
 * bağlanır; durumu okur, komut gönderir, her eylemde yeniden çizer.
 * ========================================================================= */
(function () {
  if (typeof document === 'undefined' || typeof window === 'undefined' || !window.AHTAPOT) return;
  const A = window.AHTAPOT, H = A.state.helpers, D = A.data;
  const $ = id => document.getElementById(id);
  let G = null, view = 'character', victoryShown = false;

  /* ---------- biçimlendirme ---------- */
  const money = n => { n = Math.round(n || 0); return (n < 0 ? '-' : '') + Math.abs(n).toLocaleString('tr-TR') + '₺'; };
  const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const bar = (v, cls) => '<div class="bar ' + cls + '"><i style="width:' + clamp(v, 0, 100) + '%"></i></div>';
  const yearOf = tick => Math.max(1, Math.ceil((tick + 1) / 12));
  const pf = () => A.state.playerFamily(G);
  const boss = () => G.characters[G.dynasty.bossId];
  const activeMembers = f => H.familyMembers(G, f).filter(c => c.status === 'active');
  const rivals = () => Object.values(G.families).filter(f => !f.isPlayer);

  /* ---------- toast & modal (alert YOK) ---------- */
  let toastT = null;
  function toast(msg, kind) {
    const t = $('toast'); t.textContent = msg; t.className = 'on ' + (kind || '');
    clearTimeout(toastT); toastT = setTimeout(() => { t.className = ''; }, 2600);
  }
  function openModal(html, forced) { const m = $('modal'); m.innerHTML = html; m.dataset.forced = forced ? '1' : ''; $('overlay').classList.add('on'); }
  function closeModal() { $('overlay').classList.remove('on'); }

  /* ---------- üst stat paneli ---------- */
  function renderTop() {
    const f = pf(), b = boss();
    $('topbar').innerHTML =
      '<div class="tb-row1">' +
        '<span class="tb-name">' + esc(b ? b.name : f.name) + '</span>' +
        '<span class="rank-chip">' + esc(H.rankName(f.rank)) + '</span>' +
      '</div>' +
      '<div class="stat-grid">' +
        statBox('Yaş', b ? b.age : '—') +
        statBox('Yıl', G.clock.year) +
        statBox('Nesil', G.dynasty.generation) +
        statBox('Temiz Banka', money(f.cleanMoney), 'clean') +
        statBox('Kirli Nakit', money(f.dirtyMoney), 'dirty') +
        statBox('Sağlık', (b ? b.attributes.health.toFixed(0) : '—')) +
        statBar('Heat', f.heat, 'heat') +
        statBar('Paranoya', b ? b.vitals.paranoia : 0, 'para') +
        statBox('Federal', (f.federalHeat || 0).toFixed(0), (f.federalHeat > 50 ? 'dirty' : '')) +
      '</div>';
  }
  const statBox = (l, v, cls) => '<div class="stat"><div class="l">' + l + '</div><div class="v ' + (cls || '') + '">' + v + '</div></div>';

  /* ---------- görünüm yardımcıları ---------- */
  const title = t => '<div class="view-title">' + t + '</div>';
  const card = (h, body) => '<div class="card"><h3>' + h + '</h3>' + body + '</div>';
  const rowKV = (k, v) => '<div class="row"><span class="muted">' + k + '</span><span>' + v + '</span></div>';
  const statLine = (l, v, cls) => '<div class="row" style="display:block;padding:6px 0"><div style="display:flex;justify-content:space-between"><span class="muted">' + l + '</span><span>' + Math.round(v) + '</span></div>' + bar(v, cls || 'para').replace('para', cls === 'heat' ? 'heat' : 'para') + '</div>';
  const dataAttrs = (act, id, arg) => 'data-act="' + act + '"' + (id !== '' && id != null ? ' data-id="' + esc(id) + '"' : '') + (arg ? ' data-arg="' + esc(arg) + '"' : '');
  const btn = (label, act, id, arg, cls) => '<button class="btn ' + (cls || '') + '" ' + dataAttrs(act, id, arg) + '>' + label + '</button>';
  const btnSm = (label, act, id, cls) => '<button class="btn sm ' + (cls || '') + '" ' + dataAttrs(act, id, '') + '>' + label + '</button>';

  /* ---------- navigasyon + render ---------- */
  function renderNav() {
    const inPrison = A.engine.isInPrison(G);
    $('nav').innerHTML = NAV.map(n => {
      const alert = (n.id === 'prison' && inPrison) ? ' alert' : '';
      return '<button class="navbtn' + (view === n.id ? ' active' : '') + alert + '" data-act="setView" data-id="' + n.id + '"><span class="i">' + n.icon + '</span><span class="t">' + n.label + '</span></button>';
    }).join('');
  }
  function renderAdvance() {
    const label = A.engine.isInPrison(G) ? '⏭️ AY GEÇİR (+1 Yıl)' : '⏭️ YAŞ AL (+1 YIL)';
    $('advancebar').innerHTML = btn(label, 'advanceYear', '', '', 'primary');
  }
  function render() {
    if (!G) return;
    renderTop();
    $('view').innerHTML = (VIEWS[view] || VIEWS.character)();
    renderAdvance(); renderNav();
  }

  /* ---------- yaşam döngüsü ---------- */
  function persist() { try { A.persist.save('auto', G); } catch (e) { } }
  function newGame() {
    G = A.state.createNewGame((Date.now() >>> 0) ^ Math.floor(Math.random() * 1e9));
    victoryShown = false; view = 'character'; closeModal(); persist();
    if (G.pendingEvent) showStart(); render();
  }
  function showStart() {
    const ev = G.pendingEvent; if (!ev) return;
    openModal('<h2>Başlangıç</h2><p>' + esc(ev.prompt) + '</p>' +
      ev.options.map(o => '<div class="opt">' + btn(esc(o.label), 'startChoice', o.id, '', 'primary') + '<div class="d">' + esc(o.desc) + '</div></div>').join(''), true);
  }
  function showGameOver() {
    openModal('<h2>Hanedan Çöktü</h2><p>Geriye varis kalmadı. Bir imparatorluk tarihe karıştı. Hanedan Skoru: <b>' + H.dynastyScore(G) + '</b></p>' + btn('Yeni Hanedan Kur', 'newGame', '', '', 'primary'), true);
  }
  function showVictory() {
    openModal('<h2 style="color:var(--gold)">👑 ZAFER</h2><p>Tüm endgame hedeflerine ulaştın; hanedanlığın efsaneye dönüştü. Skor: <b>' + H.dynastyScore(G) + '</b></p>' + btn('Devam Et', 'closeModal', '', '', 'gold'), false);
  }
  function afterChange() {
    persist();
    if (A.engine.isInPrison(G) && view !== 'prison') view = 'prison';
    render();
    if (G.flags.gameOver) showGameOver();
    else if (G.flags.victory && !victoryShown) { victoryShown = true; showVictory(); }
  }

  /* ---------- eylem yönlendirme ---------- */
  function val(id, def) { const e = $(id); return e ? e.value : def; }
  function msg(res, okMsg) {
    if (!res) { toast(okMsg || 'Tamam', 'ok'); return; }
    if (res.ok === false) {
      const m = { no_money: 'Yetersiz para', limit: 'Ekip limiti dolu', married: 'Zaten evli', no_spouse: 'Önce evlen', owned: 'Zaten cepte', standing_low: 'İlişki yetersiz', not_in_prison: 'Hapiste değilsin', boss: 'Patron olmaz', no_stock: 'Stok yok', no_target: 'Hedef yok' };
      toast(m[res.reason] || ('Olmadı (' + (res.reason || '?') + ')'), 'bad');
    } else toast(okMsg || 'Tamam', 'ok');
  }

  function dispatch(act, id, arg) {
    if (!G && act !== 'newGame') return;
    switch (act) {
      case 'setView': { view = id; render(); const ve = $('view'); ve.classList.remove('swap'); void ve.offsetWidth; ve.classList.add('swap'); return; }
      case 'closeModal': closeModal(); return;
      case 'newGame': newGame(); return;
      case 'startChoice': A.state.applyStartChoice(G, id); closeModal(); afterChange(); return;
      case 'advanceYear': { A.engine.advanceYear(G); toast('Bir yıl geçti', 'gold'); afterChange(); return; }
      case 'save': persist(); toast('Kaydedildi', 'ok'); return;
      case 'load': { const l = A.persist.load('auto'); if (l) { G = l; toast('Yüklendi', 'ok'); afterChange(); } else toast('Kayıt yok', 'bad'); return; }
      case 'export': { const s = A.persist.exportSave(G); openModal('<h2>Dışa Aktar</h2><p>Bu metni yedekle:</p><textarea class="input" style="height:140px">' + esc(s) + '</textarea>' + btn('Kapat', 'closeModal', '', '', '')); return; }
      case 'selftest': { const t = A.test.selfTest(); G.__lastTest = { ok: t.ok, passed: t.passed, total: t.total }; toast('Self-test ' + t.passed + '/' + t.total, t.ok ? 'ok' : 'bad'); render(); return; }
      case 'hire': msg(A.commands.hire(G, { job: val('hireJob', 'none') }), 'İşe alındı'); break;
      case 'fire': msg(A.commands.fire(G, id), 'Kovuldu'); break;
      case 'assignJob': msg(A.commands.assignJob(G, id, val('job_' + id, 'none')), 'Pozisyon atandı'); break;
      case 'surveil': { const r = A.commands.surveil(G, id); r && r.ok ? toast(r.hint || 'Takip edildi', 'ok') : msg(r); break; }
      case 'interrogate': { const r = A.commands.interrogate(G, id); r && r.exposed ? toast('KÖSTEBEK İFŞA!', 'bad') : (r && r.falseAlarm ? toast('Yanlış alarm (paranoya)', 'bad') : msg(r, 'Sorgulandı')); break; }
      case 'loyaltyTest': { const r = A.commands.loyaltyTest(G, id); r && r.exposed ? toast('KÖSTEBEK İFŞA!', 'bad') : msg(r, r && r.loyal ? 'Sadık çıktı' : 'Test edildi'); break; }
      case 'silence': { const r = A.commands.silence(G, id); r && r.ok ? toast(r.wasMole ? 'Hain susturuldu' : 'Masum infaz! Ekip tedirgin', r.wasMole ? 'ok' : 'bad') : msg(r); break; }
      case 'buyGood': msg(A.commands.buyGood(G, id, +val('tradeQty', 1), val('tradeCity')), 'Satın alındı'); break;
      case 'sellGood': msg(A.commands.sellGood(G, id, +val('tradeQty', 1), val('tradeCity')), 'Satıldı'); break;
      case 'bribe': msg(A.commands.bribe(G, id), 'Rüşvet verildi'); break;
      case 'buyBusiness': msg(A.commands.buyBusiness(G, id), 'İşletme alındı'); break;
      case 'declareWar': msg(A.commands.declareWar(G, id), 'Savaş ilan edildi'); break;
      case 'ceasefire': msg(A.commands.ceasefire(G, id), 'Ateşkes'); break;
      case 'proposeAlliance': msg(A.commands.proposeAlliance(G, id), 'İttifak kuruldu'); break;
      case 'improveRelations': msg(A.commands.improveRelations(G, id), 'İlişki düzeldi'); break;
      case 'embargo': msg(A.commands.embargo(G, id), 'Ambargo'); break;
      case 'espionage': { const r = A.commands.espionage(G, id); r && r.ok ? toast(r.success ? 'İstihbarat: ' + r.result : 'Casus yakalandı', r.success ? 'ok' : 'bad') : msg(r); break; }
      case 'assassinate': { const r = A.commands.assassinate(G, id); r && r.ok ? toast(r.success ? 'Suikast başarılı' : 'Suikast başarısız', r.success ? 'ok' : 'bad') : msg(r); break; }
      case 'territoryWar': { const r = A.commands.territoryWar(G, id); r ? toast(r.winnerId === pf().id ? 'Savaşı kazandın!' + (r.captured ? ' Bölge alındı.' : '') : 'Savaşı kaybettin', r.winnerId === pf().id ? 'ok' : 'bad') : toast('Olmadı', 'bad'); break; }
      case 'prisonFight': { const r = A.commands.prisonFight(G); r && r.ok ? toast(r.win ? 'Ringde kazandın' : 'Ringde yenildin', r.win ? 'ok' : 'bad') : msg(r); break; }
      case 'prisonBribeGuard': msg(A.commands.prisonBribeGuard(G), 'Gardiyan rüşvetlendi'); break;
      case 'prisonRecruit': { const r = A.commands.prisonRecruit(G); r && r.ok ? toast(r.recruited ? 'Mahkum devşirildi' : 'İkna olmadı', r.recruited ? 'ok' : 'bad') : msg(r); break; }
      case 'prisonEscape': { const r = A.commands.prisonEscape(G, arg); r && r.ok ? toast(r.escaped ? '🏃 FİRAR BAŞARILI!' : 'Firar başarısız, ceza uzadı', r.escaped ? 'gold' : 'bad') : msg(r); break; }
      case 'marry': msg(A.commands.marry(G), 'Evlendin'); break;
      case 'haveChild': { const r = A.commands.haveChild(G); r && r.ok ? toast('Çocuk doğdu: ' + r.trait, 'gold') : msg(r); break; }
      case 'setHeir': msg(A.commands.setHeir(G, id), 'Veliaht belirlendi'); break;
      case 'fleeCountry': { const r = A.commands.fleeCountry(G, val('haven')); r && r.ok ? toast(r.caught ? 'İade! Yakalandın' : 'Yurtdışına kaçtın', r.caught ? 'bad' : 'gold') : msg(r); break; }
      default: return;
    }
    afterChange();
  }

  /* ---------- olay bağlama ---------- */
  $('app').addEventListener('click', e => {
    const el = e.target.closest('[data-act]');
    if (el) { e.preventDefault(); dispatch(el.getAttribute('data-act'), el.getAttribute('data-id'), el.getAttribute('data-arg')); return; }
    // modal dışına tıklayınca kapat (zorunlu modal hariç)
    if (e.target.id === 'overlay' && $('modal').dataset.forced !== '1') closeModal();
  });

  /* ---------- başlat ---------- */
  function init() {
    try { G = A.persist.load('auto'); } catch (e) { G = null; }
    if (!G) { G = A.state.createNewGame((Date.now() >>> 0) ^ Math.floor(Math.random() * 1e9)); }
    render();
    setTimeout(() => { $('splash').classList.add('hide'); }, 850);
    if (G.pendingEvent) setTimeout(showStart, 700);
    window.AHTAPOT.ui = { render, dispatch, get game() { return G; } };
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
})();
</script>
</body>
</html>
