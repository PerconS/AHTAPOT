  /* ----------------------------------------------------------------------
   * model — entity factory'leri (saf veri, davranış yok)
   * -------------------------------------------------------------------- */
  function nextId(state, prefix) { return prefix + (state.meta.nextId++); }

  const model = {
    createCharacter(state, rng, familyId, role) {
      const base = role === 'BOSS' ? 55 : role === 'UNDERBOSS' ? 45 : 35;
      const stat = () => util.clamp(base + rng.int(-10, 25), 1, 100);
      return {
        id: nextId(state, 'c'),
        familyId,
        name: rng.pick(data.firstNames) + ' ' + rng.pick(data.lastNames),
        role,
        // BitLife tarzı yaşam öznitelikleri (üst panel)
        attributes: { health: 100, happiness: rng.int(40, 80), intelligence: stat(), looks: stat(), reputation: rng.int(5, 25) },
        // anlık yaşamsal değerler
        vitals: { energy: 100, heat: 0, paranoia: rng.int(0, 15) },
        // psikolojik durum (PsychologySystem işler)
        psyche: { conscience: rng.int(20, 70), trauma: 0, stress: rng.int(10, 40), addiction: 0 },
        // operasyon/işletme becerileri (skills tek kaynaktır)
        skills: { combat: stat(), cunning: stat(), charisma: stat(), loyalty: stat(), management: stat(), hacking: rng.int(1, 30) },
        // ekip öznitelikleri (Sadakat=skills.loyalty, Zeka=attributes.intelligence)
        courage: rng.int(20, 80),       // Cesaret
        greed: rng.int(10, 75),         // Açgözlülük
        job: 'none',                    // ekip pozisyonu (data.jobs)
        // köstebek sistemi (gizli durum)
        isMole: false,
        moleRisk: 0,                    // arka planda büyür (düşük sadakat + açgözlülük)
        suspicion: 0,                   // oyuncunun bildiği şüphe düzeyi (takip/sorgu açar)
        // hapishane RPG durumu
        isArrested: false,
        prison: null,                   // { sentence, respect, comfort, guards, recruits[] }
        // hanedan & soy
        spouseId: null,
        childrenIds: [],
        parentIds: [],
        traits: [],
        age: rng.int(role === 'BOSS' ? 40 : 22, role === 'BOSS' ? 62 : 45),
        health: 100,
        status: 'active',
        isHeir: false,
        relations: {},
      };
    },
    createTerritory(state, rng, name) {
      return {
        id: nextId(state, 't'),
        name,
        ownerId: null,
        baseIncome: rng.int(200, 900),
        heat: 0,
        defense: rng.int(5, 25),
        adjacency: [],
        upgrades: [],
        contested: false,
      };
    },
    createBusiness(state, ownerId, type) {
      return {
        id: nextId(state, 'b'),
        ownerId,
        type: type.id,
        income: type.income,              // temiz banka geliri kapasitesi
        launderCapacity: type.launder,    // tick başına aklanabilir kirli nakit
        coverStrength: type.cover,
        staffCost: type.staff,            // personel gideri
        auditRisk: type.audit,            // vergi/denetim riski
        efficiency: type.eff,             // kirli→temiz aklama verimi
        heat: 0,
      };
    },
    createFamily(state, rng, name, isPlayer, school, fullName) {
      const country = rng.pick(data.countries);
      return {
        id: nextId(state, 'f'),
        name: fullName || (name + ' Ailesi'),
        isPlayer,
        school: (school || rng.pick(data.schools)).id,   // suç ekolü
        archetype: null,                                  // AI arketipi (aiProfile ile senkron)
        rank: 0,                                          // rütbe indeksi (data.ranks)
        country,
        city: rng.pick(data.citiesByCountry[country]),
        cleanMoney: isPlayer ? rules.start.clean : rng.int(2000, 8000),
        dirtyMoney: isPlayer ? rules.start.dirty : rng.int(0, 3000),
        reputation: rng.int(10, 40),
        heat: 0,
        armedMen: isPlayer ? 4 : rng.int(5, 14),          // [balans] erken savaşlar daha adil
        inventory: {},                                    // kaçak mal stoğu { goodId: adet }
        corruption: { mayor: false, prosecutor: false, policeChief: false, judge: false, minister: false },
        federalHeat: 0,                                   // Federal Takip Skoru (FBI/Interpol...)
        smuggleVolume: 0,                                 // birikmiş kaçakçılık hacmi (federal tetik)
        wiretapTicks: 0,                                  // aktif telefon dinleme süresi
        redNotice: false,                                 // kırmızı bülten (uluslararası yakalama)
        inExile: false,                                   // yurtdışına kaçtı mı (uzaktan operasyon)
        memberIds: [],
        territoryIds: [],
        businessIds: [],
        relations: {},                                    // diğer ailelerle ilişki (createNewGame doldurur)
        aiProfile: isPlayer ? null : {
          archetype: rng.pick(data.archetypes),
          aggression: rng.next(), greed: rng.next(), caution: rng.next(), vengeance: rng.next(),
          goals: [], grudges: {},
        },
      };
    },
    createOperation(state, rng, familyId, crime, crewIds, targetId) {
      return {
        id: nextId(state, 'o'),
        familyId,
        type: crime.id,
        crewIds: crewIds.slice(),
        targetId: targetId || null,
        baseRisk: crime.baseRisk,
        risk: crime.baseRisk,
        progress: 0,
        durationTicks: crime.duration,
        status: 'active',
        startedTick: state.clock.tick,
        expectedReward: crime.rewardMax ? rng.int(crime.rewardMin, crime.rewardMax) : 0,
        heat: crime.heat,
      };
    },
  };

  /* ----------------------------------------------------------------------
   * state — yeni oyun kurulumu (deterministik, seed'e bağlı)
   * -------------------------------------------------------------------- */
  const CURRENT_VERSION = 6;

  function createNewGame(seed, opts) {
    opts = opts || {};
    const rng = util.makeRng(seed >>> 0 || 1);
    const state = {
      meta: { version: CURRENT_VERSION, seed: seed >>> 0, createdAt: opts.now != null ? opts.now : Date.now(), saveName: opts.saveName || 'Yeni Hanedan', nextId: 1 },
      clock: { tick: 0, speed: 1, paused: false, year: 1, month: 1 },
      pendingEvent: null,        // bekleyen karar olayı (başlangıç senaryosu vb.)
      rngState: 0,
      families: {},
      characters: {},
      territories: {},
      operations: {},
      businesses: {},
      market: { goods: {}, trends: { policePressure: 0.2, economy: 0.5 } },
      world: { policeHeatGlobal: 10, newsFeed: [], factions: { police: { influence: 0.5 }, politics: { influence: 0.4 } } },
      dynasty: { bossId: null, heirs: [], generation: 1, legacyPoints: 0, perks: [], history: [], collapsed: false },
      achievements: { unlocked: {} },
      stats: { assassinations: 0, warsWon: 0, escapes: 0, prisonFightsWon: 0, molesCaught: 0, children: 0, peakWealth: 0 },
      eventLog: [],
      flags: {},
    };

    // --- Bölgeler: bağlı bir graf (zincir + deterministik çapraz bağlar) ---
    const terrs = data.districts.slice(0, rules.territoryCount).map(n => model.createTerritory(state, rng, n));
    terrs.forEach(t => { state.territories[t.id] = t; });
    for (let i = 0; i < terrs.length; i++) {
      if (i > 0) link(terrs[i], terrs[i - 1]);                 // zincir → bağlılık garantisi
      if (rng.chance(0.5) && i >= 2) link(terrs[i], terrs[rng.int(0, i - 1)]); // çapraz bağ
    }
    function link(a, b) {
      if (!a.adjacency.includes(b.id)) a.adjacency.push(b.id);
      if (!b.adjacency.includes(a.id)) b.adjacency.push(a.id);
    }

    // --- Oyuncu ailesi + patron + ekip ---
    const playerSchool = opts.school ? data.schools.find(s => s.id === opts.school) : rng.pick(data.schools);
    const player = model.createFamily(state, rng, rng.pick(data.familyNames), true, playerSchool);
    player.rank = 0;
    player.reputation = rng.int(3, 12);   // genç başlangıç: itibar düşük
    state.families[player.id] = player;
    const boss = model.createCharacter(state, rng, player.id, 'BOSS');
    boss.age = rules.startAge;             // 14 yaşında başla (BitLife tarzı)
    boss.isHeir = false;
    state.characters[boss.id] = boss;
    player.memberIds.push(boss.id);
    state.dynasty.bossId = boss.id;
    for (let i = 0; i < 4; i++) {
      const role = i === 0 ? 'UNDERBOSS' : i === 1 ? 'CAPO' : 'SOLDIER';
      const c = model.createCharacter(state, rng, player.id, role);
      state.characters[c.id] = c;
      player.memberIds.push(c.id);
    }
    applySchoolLoyalty(state, player);    // ekol sadakat bonusu (örn. Yakuza +25)

    // --- 6 isimli rakip aile (sabit kadro) ---
    data.rivalFamilies.forEach(rf => {
      const sc = data.schools.find(s => s.id === rf.school);
      const fam = model.createFamily(state, rng, null, false, sc, rf.full);
      fam.archetype = rf.archetype;
      if (fam.aiProfile) fam.aiProfile.archetype = rf.archetype;
      state.families[fam.id] = fam;
      const bossA = model.createCharacter(state, rng, fam.id, 'BOSS');
      state.characters[bossA.id] = bossA;
      fam.memberIds.push(bossA.id);
      const crewN = rng.int(2, 4);
      for (let j = 0; j < crewN; j++) {
        const c = model.createCharacter(state, rng, fam.id, rng.pick(['CAPO', 'SOLDIER', 'SOLDIER']));
        state.characters[c.id] = c;
        fam.memberIds.push(c.id);
      }
      applySchoolLoyalty(state, fam);
    });

    // --- Bölge sahipliği dağıt: oyuncu + AI + bir kısmı tarafsız ---
    const fams = Object.values(state.families);
    const shuffled = rng.pickN(terrs, terrs.length);
    let ti = 0;
    fams.forEach(f => {
      const owned = f.isPlayer ? 2 : rng.int(1, 2);
      for (let k = 0; k < owned && ti < shuffled.length; k++, ti++) {
        const t = shuffled[ti];
        t.ownerId = f.id;
        f.territoryIds.push(t.id);
      }
    });
    // kalan bölgeler tarafsız kalır (genişleme için av sahası)

    // --- Oyuncuya başlangıç işletmeleri (aklama kapasitesi) ---
    [data.businessTypes[0], data.businessTypes[2]].forEach(bt => {
      const b = model.createBusiness(state, player.id, bt);
      state.businesses[b.id] = b;
      player.businessIds.push(b.id);
    });

    // --- Dinamik piyasa: kaçak mal fiyatları ---
    data.goods.forEach(g => {
      state.market.goods[g.id] = { price: g.base, base: g.base, supply: 1, demand: 1, vol: g.vol };
    });

    // --- Aileler arası ilişki ağı (başlangıçta barış, hafif rastgele standing) ---
    const allFams = Object.values(state.families);
    allFams.forEach(a => {
      allFams.forEach(b => {
        if (a.id === b.id) return;
        a.relations[b.id] = { standing: rng.int(-20, 20), treaty: 'peace' };
      });
    });

    // --- Dynasty ilk bölümü ---
    state.dynasty.history.push({ generation: 1, bossName: boss.name, startedYear: 1, peakWealth: player.cleanMoney, note: 'Hanedanın kuruluşu.' });

    // --- Başlangıç senaryosu: 14 yaşındasın, baban tefecilere borçlu ---
    state.pendingEvent = {
      id: 'gambling_debt',
      prompt: `${boss.name}, ${player.city}'de ${boss.age} yaşındasın. Baban yerel tefecilere büyük bir kumar borcu taktı; adamlar kapıya dayandı. Ne yaparsın?`,
      options: [
        { id: 'rob', label: 'Tefeciyi soy', desc: 'Cesur ve kanlı bir başlangıç.' },
        { id: 'police', label: 'Polise git', desc: 'Temiz ama riskli; sokak seni affetmez.' },
        { id: 'gang', label: 'Mahalle çetesinden yardım iste', desc: 'Borçlu doğarsın ama koruma kazanırsın.' },
      ],
    };

    state.rngState = rng.state;
    report(state, util.makeRng(state.rngState), 'world.start', { text: `${player.name} (${data.schools.find(s => s.id === player.school).name}) sahnede. ${Object.keys(state.families).length - 1} rakip aile, ${terrs.length} bölge. ${boss.name} ${boss.age} yaşında yola çıkıyor.` });
    return state;
  }

  // Ekol sadakat bonusunu ailenin üyelerine uygular (örn. Yakuza loyaltyBonus:25)
  function applySchoolLoyalty(state, fam) {
    const sc = data.schools.find(s => s.id === fam.school);
    const bonus = sc && sc.modifiers.loyaltyBonus ? sc.modifiers.loyaltyBonus : 0;
    if (!bonus) return;
    fam.memberIds.forEach(id => {
      const c = state.characters[id];
      if (c && c.skills) c.skills.loyalty = util.clamp(c.skills.loyalty + bonus, 1, 100);
    });
  }

  // Başlangıç senaryosu kararını uygular → farklı başlangıç yolları
  function applyStartChoice(state, optionId) {
    if (!state.pendingEvent || state.pendingEvent.id !== 'gambling_debt') return false;
    const rng = util.makeRng(state.rngState);
    const fam = playerFamily(state);
    const boss = state.characters[state.dynasty.bossId];
    let text = '';
    if (optionId === 'rob') {
      fam.dirtyMoney += 3000; fam.heat = util.clamp(fam.heat + 18, 0, 100); fam.reputation = util.clamp(fam.reputation + 8, 0, 100);
      boss.skills.combat = util.clamp(boss.skills.combat + 8, 1, 100); boss.psyche.trauma += 15; boss.psyche.conscience = util.clamp(boss.psyche.conscience - 12, 0, 100);
      state.flags.startPath = 1; // kanlı yol
      text = `${boss.name} tefecinin kasasını bastı. İlk kan döküldü; sokak adını öğrendi.`;
    } else if (optionId === 'police') {
      fam.heat = util.clamp(fam.heat - 10, 0, 100); fam.reputation = util.clamp(fam.reputation - 6, 0, 100); fam.cleanMoney += 500;
      boss.attributes.happiness = util.clamp(boss.attributes.happiness - 5, 0, 100); boss.psyche.conscience = util.clamp(boss.psyche.conscience + 10, 0, 100);
      state.flags.startPath = 2; state.flags.snitchBrand = 1; // muhbir damgası
      text = `${boss.name} polise gitti. Borç çözüldü ama mahallede "ispiyoncu" damgası peşine takıldı.`;
    } else if (optionId === 'gang') {
      fam.reputation = util.clamp(fam.reputation + 4, 0, 100); fam.dirtyMoney += 800;
      const c = model.createCharacter(state, rng, fam.id, 'SOLDIER'); c.skills.loyalty = util.clamp(c.skills.loyalty + 15, 1, 100);
      state.characters[c.id] = c; fam.memberIds.push(c.id);
      state.flags.startPath = 3; state.flags.gangDebt = 1; // çeteye borçlu
      text = `${boss.name} mahalle çetesine sığındı. ${c.name} yanına katıldı ama artık birine borçlusun.`;
    } else { return false; }
    state.pendingEvent = null;
    report(state, rng, 'startChoice', { text });
    state.rngState = rng.state;
    return true;
  }

  /* ----------------------------------------------------------------------
   * helpers — türetilmiş erişimciler (persist edilmez)
   * -------------------------------------------------------------------- */
  function playerFamily(state) { return Object.values(state.families).find(f => f.isPlayer); }
  function familyMembers(state, fam) { return fam.memberIds.map(id => state.characters[id]).filter(Boolean); }
  function busyCrew(state, familyId) {
    const set = new Set();
    Object.values(state.operations).forEach(o => { if (o.familyId === familyId && o.status === 'active') o.crewIds.forEach(c => set.add(c)); });
    return set;
  }
  function totalMoney(fam) { return fam.cleanMoney + fam.dirtyMoney; }
  // Ekol modifier'ı oku (yoksa nötr 1.0 / 0)
  function schoolMod(fam, key, def) {
    const sc = data.schools.find(s => s.id === fam.school);
    const v = sc && sc.modifiers[key];
    return (v != null) ? v : (def != null ? def : 1);
  }
  // Saygınlık + servete göre uygun rütbe indeksi
  function rankFor(fam) {
    const wealth = totalMoney(fam);
    let r = 0;
    for (let i = 0; i < data.ranks.length; i++) {
      if (fam.reputation >= data.ranks[i].minRep && wealth >= data.ranks[i].minWealth) r = i;
    }
    return r;
  }
  function rankName(idx) { return (data.ranks[idx] || data.ranks[0]).name; }
  // Ekip öznitelikleri görünümü (Sadakat/Cesaret/Açgözlülük/Zeka)
  function crewAttrs(c) {
    return { loyalty: c.skills.loyalty, courage: c.courage, greed: c.greed, intelligence: c.attributes.intelligence };
  }
  function crewLimit(fam) { return rules.crewLimitBase + fam.rank * rules.crewLimitPerRank; }
  function jobName(id) { const j = data.jobs.find(x => x.id === id); return j ? j.name : '—'; }
  function membersWithPerk(state, fam, perk) {
    return familyMembers(state, fam).filter(c => c.status === 'active' && data.jobs.some(j => j.id === c.job && j.perk === perk));
  }
  // Aile gücü (deterministik): silahlı adam × ortalama dövüş + topraklar + rütbe
  function familyPower(state, fam) {
    const combatMembers = familyMembers(state, fam).filter(c => c.status === 'active');
    const avgCombat = util.avg(combatMembers.map(c => c.skills.combat)) || 30;
    const violence = schoolMod(fam, 'violenceMult', 1);
    return Math.round((fam.armedMen * (avgCombat / 50) + fam.territoryIds.length * 6 + fam.rank * 8) * violence);
  }
  function avgLoyalty(state, fam) { const m = familyMembers(state, fam).filter(c => c.status === 'active'); return Math.round(util.avg(m.map(c => c.skills.loyalty)) || 0); }
  // İlişki erişim/ayar (çift yönlü tutulur)
  function relationOf(fam, otherId) { return fam.relations[otherId] || (fam.relations[otherId] = { standing: 0, treaty: 'peace' }); }
  function setTreaty(state, aId, bId, treaty) {
    const a = state.families[aId], b = state.families[bId];
    if (!a || !b) return;
    relationOf(a, bId).treaty = treaty; relationOf(b, aId).treaty = treaty;
  }
  function adjustStanding(state, aId, bId, delta) {
    const a = state.families[aId], b = state.families[bId];
    if (!a || !b) return;
    const ra = relationOf(a, bId), rb = relationOf(b, aId);
    ra.standing = util.clamp(ra.standing + delta, -100, 100);
    rb.standing = util.clamp(rb.standing + delta, -100, 100);
  }
  function areAtWar(fam, otherId) { return relationOf(fam, otherId).treaty === 'war'; }
  // Makro ekonomi → mal kategorisi fiyat çarpanı (econ 0.1..1.0)
  function catFactor(cat, econ) {
    switch (cat) {
      case 'luxury': return 0.7 + econ * 0.7;   // refahta lüks pahalanır
      case 'art': return 0.75 + econ * 0.6;
      case 'tech': return 0.85 + econ * 0.4;
      case 'crypto': return 0.6 + econ * 0.9;   // en oynak
      case 'weapon': return 1.25 - econ * 0.4;  // krizde silah pahalanır
      default: return 1;
    }
  }
  // Toplam yozlaşma seviyesi (0..100): sahip olunan figürlerin ağırlık toplamı
  function corruptionLevel(fam) {
    if (!fam.corruption) return 0;
    let lvl = 0; data.officials.forEach(o => { if (fam.corruption[o.id]) lvl += o.corruption; });
    return Math.min(100, lvl);
  }
  // Şehir × mal fiyat faktörü (deterministik) → bölgesel arbitraj fırsatı (0.85..1.15)
  function cityFactor(city, goodId) {
    const h = parseInt(util.fnv1a(String(city) + goodId), 16);
    return 0.85 + (h % 31) / 100;
  }

  /* ----------------------------------------------------------------------
   * story — procedural anlatı motoru (şablon + ikame)
   * -------------------------------------------------------------------- */
  const story = {
    narrate(type, ctx, rng) {
      const templates = data.story[type];
      if (!templates) return ctx.text || '';
      let line = rng ? rng.pick(templates) : templates[0];
      return line.replace(/\{(\w+)\}/g, (_, k) => (ctx[k] != null ? ctx[k] : '?'));
    },
  };

  // report: yapısal olayı anlatıya çevirip eventLog + newsFeed'e (dairesel) yazar
  function report(state, rng, type, ctx) {
    const text = (ctx && ctx.text) ? ctx.text : story.narrate(type, ctx || {}, rng);
    const entry = { tick: state.clock.tick, type, text };
    state.eventLog.push(entry);
    if (state.eventLog.length > rules.eventLogMax) state.eventLog.shift();
    if (text) {
      state.world.newsFeed.unshift(entry);
      if (state.world.newsFeed.length > rules.newsFeedMax) state.world.newsFeed.pop();
    }
    return entry;
  }

  /* ----------------------------------------------------------------------
   * systems — her biri (state, rng) alır, mutasyon yapar, olay raporlar
   * -------------------------------------------------------------------- */
  const systems = {
    economy(state, rng) {
      Object.values(state.families).forEach(fam => {
        // Bölge haraçları → kirli para (ısıyla hafif düşer, ekol çarpanıyla)
        let haraç = 0;
        fam.territoryIds.forEach(tid => {
          const t = state.territories[tid];
          if (!t) return;
          haraç += Math.round(t.baseIncome * util.clamp(1 - t.heat / 200, 0.4, 1));
        });
        haraç = Math.round(haraç * schoolMod(fam, 'dirtyIncomeMult', 1));  // Kartel +30% vb.
        if (fam.inExile) haraç = Math.round(haraç * (1 - rules.exileIncomePenalty));  // uzaktan operasyon cezası
        fam.dirtyMoney += haraç;

        // Personel maaşı: rol maaşı + pozisyon (job) maaşı (önce temiz, sonra kirli)
        let upkeep = 0;
        familyMembers(state, fam).forEach(c => {
          if (c.status !== 'active') return;
          upkeep += (rules.salary[c.role] || 0) + (rules.jobSalary[c.job] || 0);
        });
        payFrom(fam, upkeep);

        // Aile ısısı zamanla soğur
        fam.heat = util.clamp(fam.heat - rules.heatDecayPerTick, 0, 100);

        if (fam.isPlayer && haraç > 0 && state.clock.tick % 5 === 0) {
          report(state, rng, 'income', { family: fam.name, amount: haraç });
        }
      });
    },

    // KARA PARA AKLAMA: işletme temiz geliri + personel gideri + kirli→temiz
    // dönüşümü (verim + Muhasebeci + ekol) + vergi denetimi (yozlaşma/avukat azaltır)
    laundering(state, rng) {
      Object.values(state.families).forEach(fam => {
        const businesses = fam.businessIds.map(id => state.businesses[id]).filter(Boolean);
        if (!businesses.length) return;
        let clean = 0, cap = 0, staff = 0, effSum = 0;
        businesses.forEach(b => { clean += b.income; cap += b.launderCapacity; staff += (b.staffCost || 0); effSum += (b.efficiency || 0.8); });
        if (isEmbargoed(fam)) clean = Math.round(clean * (1 - rules.embargoIncomePenalty));
        cap = Math.round(cap * (1 + rules.accountantLaunderBoost * membersWithPerk(state, fam, 'launder').length));
        const avgEff = effSum / businesses.length;
        fam.cleanMoney += clean;
        payFrom(fam, staff);   // personel gideri
        // kirli → temiz
        const launder = Math.min(fam.dirtyMoney, cap);
        if (launder > 0) {
          fam.dirtyMoney -= launder;
          const cut = util.clamp(rules.launderCut * schoolMod(fam, 'launderCostMult', 1), 0, 0.9);
          fam.cleanMoney += Math.round(launder * (1 - cut) * avgEff);
        }
        // vergi/denetim riski
        const corr = corruptionLevel(fam);
        const lawyers = membersWithPerk(state, fam, 'legal').length;
        businesses.forEach(b => {
          let auditRisk = (b.auditRisk != null ? b.auditRisk : 0.05) * (rules.auditPolicePressureBase + state.market.trends.policePressure);
          auditRisk *= (1 - corr / rules.corruptionAuditDivisor);
          if (fam.corruption && (fam.corruption.minister || fam.corruption.prosecutor)) auditRisk *= 0.6;
          auditRisk *= (1 - 0.1 * lawyers);
          if (rng.chance(util.clamp(auditRisk, 0, 0.6))) {
            const fine = Math.round(fam.cleanMoney * rules.auditFineRate + 2000);
            payFrom(fam, fine); fam.heat = util.clamp(fam.heat + 8, 0, 100);
            const bt = data.businessTypes.find(t => t.id === b.type);
            if (fam.isPlayer) report(state, rng, 'launder.audit', { family: fam.name, business: bt ? bt.name : b.type, amount: fine });
          }
        });
      });
    },

    // DİNAMİK PİYASA: kaçak mal fiyatları (mean-reversion + makro tilt + dalga)
    market(state, rng) {
      const econ = state.market.trends.economy;
      data.goods.forEach(g => {
        const m = state.market.goods[g.id]; if (!m) return;
        const target = m.base * catFactor(g.cat, econ);
        let p = m.price + (target - m.price) * rules.marketReversion + (rng.next() - 0.5) * g.vol * m.base;
        m.price = util.clamp(Math.round(p), Math.round(m.base * 0.4), Math.round(m.base * 2.2));
        m.demand = util.clamp(m.demand + (rng.next() - 0.5) * 0.05, 0.2, 1.8);
        m.supply = util.clamp(m.supply + (rng.next() - 0.5) * 0.05, 0.2, 1.8);
      });
    },

    // SİYASİ YOZLAŞMA: rüşvet bakımı + ısı bastırma + mahkeme (dosya kapatma)
    corruption(state, rng) {
      Object.values(state.families).forEach(fam => {
        if (!fam.corruption) return;
        let upkeep = 0; data.officials.forEach(o => { if (fam.corruption[o.id]) upkeep += o.upkeep; });
        if (upkeep > 0) {
          if (fam.cleanMoney >= upkeep) fam.cleanMoney -= upkeep;
          else { // ödenemezse bir figür desteğini çeker
            const owned = data.officials.filter(o => fam.corruption[o.id]);
            if (owned.length) { const drop = rng.pick(owned); fam.corruption[drop.id] = false; if (fam.isPlayer) report(state, rng, 'corruption.collapse', { family: fam.name, name: drop.name }); }
          }
        }
        const lvl = corruptionLevel(fam);
        if (lvl > 0) fam.heat = util.clamp(fam.heat - lvl * rules.corruptionHeatSuppress, 0, 100);
        if (fam.corruption.judge || fam.corruption.prosecutor) {
          familyMembers(state, fam).filter(c => c.status === 'jailed').forEach(c => {
            if (rng.chance(lvl / rules.courtReleaseDivisor)) { c.status = 'active'; if (fam.isPlayer) report(state, rng, 'corruption.release', { name: c.name }); }
          });
        }
      });
    },

    crime(state, rng) {
      Object.values(state.operations).forEach(op => {
        if (op.status !== 'active') return;
        op.progress += 1 / op.durationTicks;
        const fam = state.families[op.familyId];
        const terr = op.targetId ? state.territories[op.targetId] : null;
        // operasyon süresince hafif ısı sızıntısı
        if (fam) fam.heat = util.clamp(fam.heat + op.heat / op.durationTicks * 0.5, 0, 100);
        if (op.progress >= 1) resolveOperation(state, rng, op, fam, terr);
      });
      // çözülmüş operasyonları temizle (eski kayıtları biriktirme)
      Object.keys(state.operations).forEach(id => {
        const o = state.operations[id];
        if (o.status !== 'active' && state.clock.tick - o.startedTick > 12) delete state.operations[id];
      });
    },

    world(state, rng) {
      // Global polis ısısı, ailelerin ortalama ısısına doğru sürüklenir
      const fams = Object.values(state.families);
      const avgHeat = util.avg(fams.map(f => f.heat));
      state.world.policeHeatGlobal += (avgHeat - state.world.policeHeatGlobal) * 0.1;
      state.world.policeHeatGlobal = util.clamp(state.world.policeHeatGlobal, 0, 100);

      // Yüksek ısılı ailelere baskın riski (polis baskısı artırır, yozlaşma bastırır)
      fams.forEach(fam => {
        const corr = corruptionLevel(fam);
        const raidChance = rules.raidChancePerTick * (rules.auditPolicePressureBase + state.market.trends.policePressure) * (1 - corr / rules.corruptionRaidDivisor);
        if (fam.heat >= rules.raidHeatThreshold && rng.chance(util.clamp(raidChance, 0, 0.9))) {
          const leaked = fam.corruption && fam.corruption.policeChief;   // operasyon önceden sızdırıldı
          let seized = Math.round((fam.dirtyMoney) * rng.int(20, 50) / 100);
          if (leaked) seized = Math.round(seized * rules.leakSeizeReduction);
          fam.dirtyMoney = Math.max(0, fam.dirtyMoney - seized);
          fam.heat = util.clamp(fam.heat - 25, 0, 100);
          // sızdırılmadıysa aktif bir üyeyi tutukla
          if (!leaked) {
            const active = familyMembers(state, fam).filter(c => c.status === 'active' && c.role !== 'BOSS');
            if (active.length) rng.pick(active).status = 'jailed';
          }
          if (fam.isPlayer && leaked) report(state, rng, 'corruption.leak', { family: fam.name });
          else if (fam.isPlayer || rng.chance(0.4)) report(state, rng, 'raid', { family: fam.name, amount: seized });
        }
      });
    },

    ai(state, rng) {
      Object.values(state.families).forEach(fam => {
        if (!fam.aiProfile) return;
        const p = fam.aiProfile;
        const busy = busyCrew(state, fam.id);
        const free = familyMembers(state, fam).filter(c => c.status === 'active' && !busy.has(c.id));
        if (free.length < 1) return;
        const chance = rules.aiOpBaseChance + p.aggression * 0.12 + p.greed * 0.06;
        if (!rng.chance(chance)) return;

        // arketipe göre suç seçimi (basit ağırlık)
        const pool = data.crimeTypes.filter(c => c.id !== 'hit');
        const crime = p.aggression > 0.6 ? rng.pick(pool) : rng.pick(pool.filter(c => c.baseRisk < 0.4));
        const crew = rng.pickN(free, Math.min(free.length, rng.int(1, 2)));
        // hedef: sahip olduğu ya da komşu tarafsız bir bölge
        const target = fam.territoryIds.length ? state.territories[rng.pick(fam.territoryIds)] : null;
        const op = model.createOperation(state, rng, fam.id, crime, crew.map(c => c.id), target ? target.id : null);
        state.operations[op.id] = op;
      });
    },

    // Psikoloji: stres ısıya yakınsar, paranoya stresten beslenir, enerji yenilenir.
    // Yüksek paranoyada oyuncuya sahte ihanet/halüsinasyon olayı enjekte edilir.
    psychology(state, rng) {
      Object.values(state.characters).forEach(c => {
        if (c.status === 'dead') return;
        const fam = state.families[c.familyId];
        const heat = fam ? fam.heat : 0;
        c.psyche.stress = util.clamp(c.psyche.stress + (heat - c.psyche.stress) * 0.1, 0, 100);
        c.vitals.paranoia = util.clamp(c.vitals.paranoia + (c.psyche.stress - 40) * 0.03, 0, 100);
        c.vitals.energy = util.clamp(c.vitals.energy + 3 - c.psyche.stress * 0.03, 0, 100);
        if (c.psyche.trauma > 0) c.psyche.trauma = util.clamp(c.psyche.trauma - 0.5, 0, 100);
      });
      const boss = state.characters[state.dynasty.bossId];
      if (boss && boss.status !== 'dead' && boss.vitals.paranoia > rules.paranoiaHallucThreshold && rng.chance(rules.paranoiaHallucChance)) {
        report(state, rng, 'paranoia', { name: boss.name });
      }
      // kalıcı delilik → koltuk devri (DynastySystem işler)
      if (boss && boss.status === 'active' && boss.vitals.paranoia >= rules.insanityParanoiaThreshold && rng.chance(0.2)) {
        boss.status = 'insane'; state.flags.successionPending = 1; state.flags.successionReason = 'insane';
      }
    },

    // Yıllık: yaşlanma + doğal sağlık düşüşü + ölüm (yalnızca advanceYear çağırır)
    aging(state, rng) {
      Object.values(state.characters).forEach(c => {
        if (c.status === 'dead') return;
        c.age += 1;
        // çocuk reşit olunca aktif üyeye/varis adayına dönüşür
        if (c.status === 'child' && c.age >= rules.childAdultAge) c.status = 'active';
        let decline = 0;
        if (c.age > rules.healthDeclineAge) decline = (c.age - rules.healthDeclineAge) * 0.6 + rng.int(0, 4);
        c.attributes.health = util.clamp(c.attributes.health - decline + (c.psyche.addiction > 50 ? -3 : 0), 0, 100);
        c.health = c.attributes.health; // geriye dönük alan senkron
        const deathRoll = (c.attributes.health <= 0) || (c.age >= rules.deathAgeBase && rng.chance((c.age - rules.deathAgeBase + 4) * 0.03));
        if (deathRoll) {
          c.status = 'dead';
          report(state, rng, 'death', { name: c.name, age: c.age });
          if (c.id === state.dynasty.bossId) state.flags.successionPending = 1; // Dynasty modülü işleyecek
        }
      });
    },

    // Yıllık: rütbe terfi kontrolü (saygınlık + servet eşikleri)
    rank(state, rng) {
      Object.values(state.families).forEach(fam => {
        const r = rankFor(fam);
        if (r > fam.rank) {
          fam.rank = r;
          if (fam.isPlayer) {
            const boss = state.characters[state.dynasty.bossId];
            report(state, rng, 'promotion', { name: boss ? boss.name : fam.name, family: fam.name, rank: rankName(r) });
          }
        } else if (r < fam.rank) {
          fam.rank = r; // servet/itibar düşerse rütbe geriler
        }
      });
    },

    // Yıllık: dinamik dünya ekonomisi olayı (enflasyon/resesyon/kripto vb.)
    worldEconomyYear(state, rng) {
      const events = [
        { id: 'inflation', name: 'Enflasyon dalgası', econ: -0.1, police: 0.05 },
        { id: 'recession', name: 'Resesyon', econ: -0.2, police: 0.0 },
        { id: 'boom', name: 'Teknoloji patlaması', econ: +0.2, police: -0.05 },
        { id: 'crypto', name: 'Kripto çılgınlığı', econ: +0.15, police: 0.05 },
        { id: 'oil', name: 'Petrol şoku', econ: -0.05, police: 0.0 },
        { id: 'reform', name: 'Polis reformu', econ: 0.0, police: 0.2 },
        { id: 'election', name: 'Seçim yılı', econ: +0.05, police: -0.1 },
      ];
      const ev = rng.pick(events);
      state.market.trends.economy = util.clamp(state.market.trends.economy + ev.econ, 0.1, 1.0);
      state.market.trends.policePressure = util.clamp(state.market.trends.policePressure + ev.police, 0, 1.0);
      state.world.policeHeatGlobal = util.clamp(state.world.policeHeatGlobal + ev.police * 40, 0, 100);
      state.flags.lastWorldEvent = ev.id;
      report(state, rng, 'worldEconomy', { event: ev.name });
    },
  };

  function payFrom(fam, amount) {
    const fromClean = Math.min(fam.cleanMoney, amount);
    fam.cleanMoney -= fromClean;
    const rest = amount - fromClean;
    fam.dirtyMoney = Math.max(0, fam.dirtyMoney - rest);
  }

  function resolveOperation(state, rng, op, fam, terr) {
    const crime = data.crimeTypes.find(c => c.id === op.type) || { skills: ['cunning'] };
    const crew = op.crewIds.map(id => state.characters[id]).filter(Boolean);
    const skill = util.avg(crew.map(c => util.avg(crime.skills.map(s => (c.skills && c.skills[s]) || 0)))) / 100;
    const heatFactor = ((fam ? fam.heat : 0) + (terr ? terr.heat : 0)) / 200;
    const catchMult = fam ? schoolMod(fam, 'catchRiskMult', 1) : 1;   // Yakuza -10%
    const wiretap = (fam && fam.wiretapTicks > 0) ? 0.1 : 0;          // dinleme operasyonu riske sokar
    op.risk = util.clamp((op.baseRisk + heatFactor - skill * 0.4) * catchMult + wiretap, 0.02, 0.95);
    const successChance = 1 - op.risk;
    const roll = rng.next();
    const district = terr ? terr.name : 'sokak';

    if (roll < successChance) {
      op.status = 'success';
      if (op.expectedReward > 0 && fam) fam.dirtyMoney += op.expectedReward;
      if (fam) { fam.heat = util.clamp(fam.heat + op.heat * 0.5, 0, 100); fam.reputation = util.clamp(fam.reputation + 1, 0, 100); }
      if (terr) terr.heat = util.clamp(terr.heat + op.heat * 0.4, 0, 100);
      if (fam && (fam.isPlayer || rng.chance(0.35))) report(state, rng, op.type === 'hit' ? 'hit' : 'op.success', { family: fam.name, crime: crime.name, district, amount: op.expectedReward });
    } else if (roll < successChance + op.risk * 0.5) {
      op.status = 'failed';
      if (fam) fam.heat = util.clamp(fam.heat + op.heat * 0.3, 0, 100);
      if (fam && fam.isPlayer) report(state, rng, 'op.failure', { family: fam.name, crime: crime.name, district });
    } else {
      op.status = 'busted';
      if (fam) fam.heat = util.clamp(fam.heat + op.heat, 0, 100);
      const caught = crew.filter(c => c.role !== 'BOSS');
      const jailed = caught.length ? rng.pick(caught) : null;
      if (jailed) jailed.status = 'jailed';
      if (fam && (fam.isPlayer || rng.chance(0.5))) report(state, rng, 'op.busted', { family: fam.name, crime: crime.name, district, name: jailed ? jailed.name : 'bir adam' });
    }
  }

  /* ----------------------------------------------------------------------
   * Ekip / Köstebek / Diplomasi — OOP sistem sınıfları + savaş formülleri
   * -------------------------------------------------------------------- */
  // Oyuncu komutlarını deterministik rng ile sarmalar (state.rngState ilerletir)
  function withRng(state, fn) { const rng = util.makeRng(state.rngState); const res = fn(rng); state.rngState = rng.state; return res; }
  function isEmbargoed(fam) { return Object.values(fam.relations).some(r => r.treaty === 'embargo'); }
  function alliesOf(state, famId) {
    const fam = state.families[famId]; if (!fam) return [];
    return Object.keys(fam.relations).filter(id => fam.relations[id].treaty === 'alliance').map(id => state.families[id]).filter(Boolean);
  }

  // EKİP SİSTEMİ — işe alım, kovma, pozisyon atama, silahlı güç senkronu
  class CrewSystem {
    update(state) {
      const pf = playerFamily(state); if (!pf) return;
      const active = familyMembers(state, pf).filter(c => c.status === 'active');
      const hit = active.filter(c => c.job === 'hitman').length;
      pf.armedMen = 2 + active.length + hit;   // tetikçiler silahlı gücü artırır
    }
    hire(state, rng, familyId, opts) {
      opts = opts || {};
      const fam = state.families[familyId]; if (!fam) return { ok: false, reason: 'no_family' };
      const active = familyMembers(state, fam).filter(c => c.status === 'active');
      if (active.length >= crewLimit(fam)) return { ok: false, reason: 'limit', limit: crewLimit(fam) };
      const cost = Math.round(rules.hireCostBase * (1 + fam.rank * 0.5));
      if (totalMoney(fam) < cost) return { ok: false, reason: 'no_money', cost };
      payFrom(fam, cost);
      const c = model.createCharacter(state, rng, fam.id, 'ASSOCIATE');
      c.job = (opts.job && data.jobs.some(j => j.id === opts.job)) ? opts.job : 'none';
      state.characters[c.id] = c; fam.memberIds.push(c.id);
      report(state, rng, 'hire', { name: c.name, family: fam.name, job: jobName(c.job) });
      return { ok: true, memberId: c.id, cost };
    }
    fire(state, rng, familyId, charId) {
      const fam = state.families[familyId], c = state.characters[charId];
      if (!fam || !c || c.familyId !== familyId) return { ok: false };
      if (c.role === 'BOSS') return { ok: false, reason: 'boss' };
      fam.memberIds = fam.memberIds.filter(id => id !== charId);
      c.familyId = null; c.status = 'dismissed';
      return { ok: true };
    }
    assignJob(state, charId, jobId) {
      const c = state.characters[charId]; if (!c) return { ok: false };
      if (jobId !== 'none' && !data.jobs.some(j => j.id === jobId)) return { ok: false, reason: 'bad_job' };
      c.job = jobId; return { ok: true };
    }
  }

  // KÖSTEBEK SİSTEMİ — arka plan risk büyümesi, ihanet eylemleri, oyuncu karşı-eylemleri
  class MoleSystem {
    update(state, rng) {
      Object.values(state.characters).forEach(c => {
        if (c.status !== 'active' || c.role === 'BOSS') return;
        const loyaltyFactor = util.clamp((60 - c.skills.loyalty) / 60, 0, 1);
        if (loyaltyFactor <= 0) { c.moleRisk = Math.max(0, c.moleRisk - 1); return; }
        const greedF = c.greed / 100, stressF = 0.5 + c.psyche.stress / 200;
        c.moleRisk = util.clamp(c.moleRisk + rules.moleRiskGrowth * loyaltyFactor * (0.5 + greedF) * stressF, 0, 100);
        if (!c.isMole && c.moleRisk >= rules.moleConvertThreshold && rng.chance(0.12)) c.isMole = true;
      });
      Object.values(state.characters).forEach(c => {
        if (!c.isMole || c.status !== 'active') return;
        if (!rng.chance(rules.moleActChance)) return;
        const fam = state.families[c.familyId]; if (fam) moleAct(state, rng, fam, c);
      });
    }
    surveil(state, rng, charId) {
      const c = state.characters[charId], pf = playerFamily(state); if (!c || !pf) return { ok: false };
      if (totalMoney(pf) < rules.surveilCost) return { ok: false, reason: 'no_money' };
      payFrom(pf, rules.surveilCost);
      c.suspicion = util.clamp(Math.round(c.moleRisk + (rng.next() - 0.5) * 20), 0, 100); // gürültülü ölçüm
      return { ok: true, suspicion: c.suspicion, hint: c.suspicion > 55 ? 'şüpheli davranışlar' : 'şimdilik temiz' };
    }
    interrogate(state, rng, charId) {
      const c = state.characters[charId], boss = state.characters[state.dynasty.bossId]; if (!c) return { ok: false };
      c.attributes.happiness = util.clamp(c.attributes.happiness - 10, 0, 100);
      c.skills.loyalty = util.clamp(c.skills.loyalty - 5, 1, 100);
      const exposeChance = util.clamp(0.3 + (boss ? boss.skills.cunning / 200 : 0) + c.moleRisk / 200, 0, 0.95);
      if (c.isMole && rng.next() < exposeChance) { c.suspicion = 100; if (state.stats) state.stats.molesCaught++; report(state, rng, 'mole.exposed', { name: c.name }); return { ok: true, exposed: true }; }
      if (!c.isMole && boss && boss.vitals.paranoia > 60 && rng.chance(0.25)) return { ok: true, exposed: false, falseAlarm: true };
      return { ok: true, exposed: false };
    }
    loyaltyTest(state, rng, charId) {
      const c = state.characters[charId], pf = playerFamily(state); if (!c || !pf) return { ok: false };
      if (totalMoney(pf) < rules.loyaltyTestCost) return { ok: false, reason: 'no_money' };
      payFrom(pf, rules.loyaltyTestCost);
      if (c.isMole) { const caught = rng.next() < 0.6; if (caught) { c.suspicion = 100; if (state.stats) state.stats.molesCaught++; report(state, rng, 'mole.exposed', { name: c.name }); return { ok: true, exposed: true }; } return { ok: true, exposed: false }; }
      c.skills.loyalty = util.clamp(c.skills.loyalty + 8, 1, 100); c.suspicion = Math.max(0, c.suspicion - 20);
      return { ok: true, loyal: true };
    }
    silence(state, rng, charId) {
      const c = state.characters[charId], pf = state.families[c && c.familyId]; if (!c || !pf) return { ok: false };
      if (c.role === 'BOSS') return { ok: false, reason: 'boss' };
      const wasMole = c.isMole;
      c.status = 'dead'; c.isMole = false;
      pf.heat = util.clamp(pf.heat + 10, 0, 100);
      const boss = state.characters[state.dynasty.bossId]; if (boss) boss.psyche.trauma = util.clamp(boss.psyche.trauma + 8, 0, 100);
      familyMembers(state, pf).filter(o => o.status === 'active').forEach(o => { o.skills.loyalty = util.clamp(o.skills.loyalty + (wasMole ? 3 : -6), 1, 100); });
      if (wasMole) { if (pf.isPlayer) report(state, rng, 'silence', { name: c.name, family: pf.name }); }
      else { pf.reputation = util.clamp(pf.reputation - 4, 0, 100); if (pf.isPlayer) report(state, rng, 'silence.innocent', { name: c.name }); }
      return { ok: true, wasMole };
    }
  }

  function moleAct(state, rng, fam, c) {
    const boss = state.characters[state.dynasty.bossId];
    const r = rng.next();
    if (r < 0.35) {                                   // polise ihbar
      fam.heat = util.clamp(fam.heat + 12, 0, 100); c.suspicion = Math.min(100, c.suspicion + 8);
      if (fam.isPlayer) report(state, rng, 'mole.tip', { family: fam.name, name: c.name });
    } else if (r < 0.65) {                            // kasadan hırsızlık
      const steal = Math.min(fam.dirtyMoney, Math.round(500 + c.greed * 30));
      if (steal > 0) { fam.dirtyMoney -= steal; if (fam.isPlayer) report(state, rng, 'mole.theft', { amount: steal }); }
    } else if (r < 0.85) {                            // rakibe ihanet
      const rivals = Object.values(state.families).filter(f => f.id !== fam.id);
      if (rivals.length) { const rv = rng.pick(rivals); adjustStanding(state, fam.id, rv.id, -8); if (fam.isPlayer) report(state, rng, 'mole.betray', { name: c.name, family: fam.name, rival: rv.name }); }
    } else {                                          // patrona suikast girişimi
      if (boss && boss.status === 'active') {
        const guards = membersWithPerk(state, fam, 'defense');
        const defense = 0.4 + guards.length * 0.2;
        const atk = 0.3 + c.courage / 200 + c.skills.combat / 200;
        if (rng.next() < util.clamp(atk - defense, 0.03, 0.8)) {
          boss.attributes.health = util.clamp(boss.attributes.health - 50, 0, 100); boss.health = boss.attributes.health;
          if (boss.attributes.health <= 0) { boss.status = 'dead'; state.flags.successionPending = 1; }
        }
        c.suspicion = 100;
        if (fam.isPlayer) report(state, rng, 'mole.hit', { name: c.name, boss: boss.name });
      }
    }
  }

  // DİPLOMASİ & ÇETE SAVAŞLARI — AI hamleleri + savaş çözümü + oyuncu eylemleri
  class DiplomacySystem {
    update(state, rng) { this.aiActions(state, rng); this.resolveWars(state, rng); }
    aiActions(state, rng) {
      Object.values(state.families).forEach(fam => {
        if (!fam.aiProfile) return;
        const p = fam.aiProfile;
        if (!rng.chance(rules.aiDiploChance + p.aggression * 0.06)) return;
        const others = Object.values(state.families).filter(f => f.id !== fam.id);
        if (!others.length) return;
        others.sort((a, b) => relationOf(fam, a.id).standing - relationOf(fam, b.id).standing);
        const target = others[0], rel = relationOf(fam, target.id);
        if (rel.treaty === 'alliance') return;
        if (rel.standing < -40 && p.aggression > 0.5 && rel.treaty !== 'war') this.declareWar(state, rng, fam.id, target.id);
        else if (rel.standing > 40 && p.caution > 0.5 && rel.treaty === 'peace') { setTreaty(state, fam.id, target.id, 'alliance'); if (target.isPlayer || fam.isPlayer) report(state, rng, 'alliance', { family: fam.name, rival: target.name }); }
        else if (p.greed > 0.6 && rel.treaty === 'peace') { setTreaty(state, fam.id, target.id, 'embargo'); if (target.isPlayer) report(state, rng, 'embargo', { family: fam.name, rival: target.name }); }
        else doEspionage(state, rng, fam.id, target.id);
      });
    }
    resolveWars(state, rng) {
      const fams = Object.values(state.families), done = {};
      fams.forEach(a => {
        Object.keys(a.relations).forEach(bId => {
          if (a.relations[bId].treaty !== 'war') return;
          const key = [a.id, bId].sort().join('|'); if (done[key]) return; done[key] = 1;
          if (state.families[bId] && rng.chance(rules.warBattleChancePerTick)) resolveBattle(state, rng, a.id, bId);
        });
      });
    }
    declareWar(state, rng, aId, bId) {
      setTreaty(state, aId, bId, 'war'); adjustStanding(state, aId, bId, -20);
      const a = state.families[aId], b = state.families[bId];
      if (a && b && (a.isPlayer || b.isPlayer)) report(state, rng, 'war.declare', { family: a.name, rival: b.name });
      return { ok: true };
    }
    ceasefire(state, rng, aId, bId) {
      setTreaty(state, aId, bId, 'ceasefire'); adjustStanding(state, aId, bId, 12);
      const a = state.families[aId], b = state.families[bId];
      if (a && b && (a.isPlayer || b.isPlayer)) report(state, rng, 'war.end', { family: a.name, rival: b.name });
      return { ok: true };
    }
    proposeAlliance(state, rng, aId, bId) {
      const rel = relationOf(state.families[aId], bId);
      if (rel.standing < 25) return { ok: false, reason: 'standing_low', standing: rel.standing };
      setTreaty(state, aId, bId, 'alliance');
      const a = state.families[aId], b = state.families[bId];
      if (a.isPlayer || b.isPlayer) report(state, rng, 'alliance', { family: a.name, rival: b.name });
      return { ok: true };
    }
    improveRelations(state, rng, aId, bId) {
      const a = state.families[aId]; if (!a) return { ok: false };
      const cost = 5000;
      if (totalMoney(a) < cost) return { ok: false, reason: 'no_money', cost };
      payFrom(a, cost); adjustStanding(state, aId, bId, 12);
      return { ok: true, standing: relationOf(a, bId).standing };
    }
    embargo(state, rng, aId, bId) {
      setTreaty(state, aId, bId, 'embargo'); adjustStanding(state, aId, bId, -8);
      const a = state.families[aId], b = state.families[bId];
      if (a.isPlayer || b.isPlayer) report(state, rng, 'embargo', { family: a.name, rival: b.name });
      return { ok: true };
    }
  }

  // Deterministik savaş çözümü: güç dengesi + şans faktörü
  function resolveBattle(state, rng, attackerId, defenderId, targetTerritoryId) {
    const A = state.families[attackerId], D = state.families[defenderId]; if (!A || !D) return null;
    let target = targetTerritoryId ? state.territories[targetTerritoryId] : null;
    if (!target) { const tts = D.territoryIds.map(id => state.territories[id]).filter(Boolean); target = tts.length ? rng.pick(tts) : null; }
    let ap = familyPower(state, A) * schoolMod(A, 'captureMult', 1);
    let dp = familyPower(state, D) + (target ? target.defense : 0);
    alliesOf(state, A.id).forEach(al => { ap += familyPower(state, al) * 0.25; });
    alliesOf(state, D.id).forEach(al => { dp += familyPower(state, al) * 0.25; });
    let score = ap / (ap + dp);
    score = util.clamp(score + (rng.next() - 0.5) * 2 * rules.warLuckSpread, 0.03, 0.97);
    const win = rng.next() < score;
    const winner = win ? A : D, loser = win ? D : A;
    loser.armedMen = Math.max(0, loser.armedMen - rng.int(1, 4));
    winner.armedMen = Math.max(0, winner.armedMen - rng.int(0, 2));
    loser.heat = util.clamp(loser.heat + 6, 0, 100); winner.heat = util.clamp(winner.heat + 8, 0, 100);
    let captured = null;
    if (win && target && target.ownerId === D.id) {
      D.territoryIds = D.territoryIds.filter(id => id !== target.id);
      target.ownerId = A.id; A.territoryIds.push(target.id); captured = target.id;
    }
    if (winner.isPlayer && state.stats) state.stats.warsWon++;
    if (A.isPlayer || D.isPlayer) report(state, rng, 'war.battle', { winner: winner.name, loser: loser.name, district: target ? target.name : 'sınır' });
    if (loser.armedMen <= 2 || rng.chance(0.12)) {
      setTreaty(state, A.id, D.id, 'ceasefire'); adjustStanding(state, A.id, D.id, 8);
      if (A.isPlayer || D.isPlayer) report(state, rng, 'war.end', { family: A.name, rival: D.name });
    }
    return { winnerId: winner.id, loserId: loser.id, captured };
  }

  function doEspionage(state, rng, famId, targetId) {
    const fam = state.families[famId], target = state.families[targetId]; if (!fam || !target) return { ok: false };
    const spies = membersWithPerk(state, fam, 'intel');
    const boss = familyMembers(state, fam).find(c => c.role === 'BOSS');
    const power = util.clamp(0.35 + spies.length * 0.15 + (boss ? boss.skills.cunning / 300 : 0), 0.1, 0.9);
    const success = rng.next() < power;
    let result;
    if (success) { result = `servet ${totalMoney(target)}₺, ${target.armedMen} silahlı adam`; adjustStanding(state, famId, targetId, -4); state.flags['intel_' + targetId] = 1; }
    else { result = 'casus yakalandı'; fam.heat = util.clamp(fam.heat + 8, 0, 100); adjustStanding(state, famId, targetId, -10); }
    if (fam.isPlayer || target.isPlayer) report(state, rng, 'espionage', { family: fam.name, rival: target.name, result });
    return { ok: true, success, result };
  }

  function doAssassinate(state, rng, famId, targetId) {
    const fam = state.families[famId], target = state.families[targetId]; if (!fam || !target) return { ok: false };
    const hitmen = membersWithPerk(state, fam, 'combat');
    const victims = familyMembers(state, target).filter(c => c.status === 'active' && c.role !== 'BOSS');
    const victim = victims.length ? rng.pick(victims) : familyMembers(state, target).find(c => c.status === 'active');
    if (!victim) return { ok: false, reason: 'no_target' };
    const power = util.clamp(0.3 + hitmen.length * 0.18 + (schoolMod(fam, 'violenceMult', 1) - 1), 0.1, 0.85);
    const success = rng.next() < power;
    if (success) {
      victim.status = 'dead'; if (victim.id === state.dynasty.bossId) state.flags.successionPending = 1;
      adjustStanding(state, famId, targetId, -25); target.armedMen = Math.max(0, target.armedMen - 2);
      if (fam.isPlayer && state.stats) state.stats.assassinations++;
      if (fam.isPlayer || target.isPlayer) report(state, rng, 'assassination', { family: fam.name, rival: target.name, name: victim.name });
    } else { fam.heat = util.clamp(fam.heat + 15, 0, 100); adjustStanding(state, famId, targetId, -12); }
    if (target.aiProfile) target.aiProfile.vengeance = util.clamp(target.aiProfile.vengeance + 0.2, 0, 1);
    return { ok: true, success };
  }

  // KAÇAK TİCARET — ucuza al, pahalıya sat (kirli para ile); yakalanma riski
  function doBuyGood(state, rng, famId, goodId, qty, city) {
    const fam = state.families[famId]; const g = data.goods.find(x => x.id === goodId); const m = state.market.goods[goodId];
    if (!fam || !g || !m) return { ok: false, reason: 'bad_good' };
    qty = Math.max(1, Math.floor(qty || 1)); city = city || fam.city;
    // [balans] alış fiyatı = mid + spread; bol arz ucuzlatır → kâr arbitraj/zamanlamadan gelir
    const unit = Math.round(m.price * cityFactor(city, goodId) * (1.05 - (m.supply - 1) * 0.08));
    const cost = unit * qty;
    if (fam.dirtyMoney < cost) return { ok: false, reason: 'no_money', cost };
    fam.dirtyMoney -= cost;
    fam.inventory[goodId] = (fam.inventory[goodId] || 0) + qty;
    fam.smuggleVolume = (fam.smuggleVolume || 0) + cost / 1000;   // federal dikkat birikir
    m.demand = util.clamp(m.demand + qty * 0.02, 0.2, 1.8);
    // yakalanma riski
    if (rng.chance(util.clamp(g.risk + fam.heat / 400, 0, 0.6))) {
      fam.heat = util.clamp(fam.heat + rules.tradeBustHeat, 0, 100);
      if (fam.isPlayer) report(state, rng, 'trade.bust', { family: fam.name, good: g.name });
    } else if (fam.isPlayer) report(state, rng, 'trade.buy', { family: fam.name, city, qty, good: g.name, amount: cost });
    return { ok: true, unit, cost };
  }
  function doSellGood(state, rng, famId, goodId, qty, city) {
    const fam = state.families[famId]; const g = data.goods.find(x => x.id === goodId); const m = state.market.goods[goodId];
    if (!fam || !g || !m) return { ok: false, reason: 'bad_good' };
    const have = fam.inventory[goodId] || 0;
    qty = Math.max(1, Math.min(Math.floor(qty || 1), have)); city = city || fam.city;
    if (have <= 0) return { ok: false, reason: 'no_stock' };
    // [balans] satış fiyatı = mid - spread; yüksek talep + Triad bonusu kârı büyütür
    const unit = Math.round(m.price * cityFactor(city, goodId) * (0.95 + (m.demand - 1) * 0.08) * schoolMod(fam, 'tradeMult', 1));
    const revenue = unit * qty;
    fam.inventory[goodId] = have - qty;
    fam.dirtyMoney += revenue;
    fam.smuggleVolume = (fam.smuggleVolume || 0) + revenue / 1000;   // federal dikkat birikir
    m.supply = util.clamp(m.supply + qty * 0.02, 0.2, 1.8);
    if (rng.chance(util.clamp(g.risk + fam.heat / 400, 0, 0.6))) {
      fam.heat = util.clamp(fam.heat + rules.tradeBustHeat, 0, 100);
      if (fam.isPlayer) report(state, rng, 'trade.bust', { family: fam.name, good: g.name });
    } else if (fam.isPlayer) report(state, rng, 'trade.sell', { family: fam.name, city, qty, good: g.name, amount: revenue });
    return { ok: true, unit, revenue };
  }

  // SİYASİ YOZLAŞMA — figür satın alma (rüşvet); temiz para ile
  function doBribe(state, rng, famId, officialId) {
    const fam = state.families[famId]; const o = data.officials.find(x => x.id === officialId);
    if (!fam || !o) return { ok: false, reason: 'bad_official' };
    if (fam.corruption[officialId]) return { ok: false, reason: 'owned' };
    if (fam.cleanMoney < o.cost) return { ok: false, reason: 'no_money', cost: o.cost };
    fam.cleanMoney -= o.cost; fam.corruption[officialId] = true;
    if (fam.isPlayer) report(state, rng, 'corruption.bribe', { family: fam.name, name: o.name });
    return { ok: true, level: corruptionLevel(fam) };
  }

  // İŞLETME SATIN ALMA — yeni aklama cephesi aç (temiz para ile)
  function doBuyBusiness(state, rng, famId, typeId) {
    const fam = state.families[famId]; const bt = data.businessTypes.find(t => t.id === typeId);
    if (!fam || !bt) return { ok: false, reason: 'bad_type' };
    if (fam.cleanMoney < bt.cost) return { ok: false, reason: 'no_money', cost: bt.cost };
    fam.cleanMoney -= bt.cost;
    const b = model.createBusiness(state, fam.id, bt);
    state.businesses[b.id] = b; fam.businessIds.push(b.id);
    return { ok: true, businessId: b.id };
  }

  // İSTİHBARAT KURUMLARI — federal takip skoru, dinleme, varlık dondurma, baskın
  // Yerel polisi/yozlaşmayı bypass eder (Bakan kısmi koruma sağlar).
  class AgencySystem {
    update(state, rng) {
      Object.values(state.families).forEach(fam => {
        // federal skor: aşırı yozlaşma + kaçakçılık hacmi + ısı
        const corr = corruptionLevel(fam);
        let gain = 0;
        if (corr > rules.federalCorruptionTrigger) gain += (corr - rules.federalCorruptionTrigger) * 0.05;
        gain += (fam.smuggleVolume || 0) / rules.federalSmuggleDivisor;
        gain += fam.heat * 0.02;
        fam.federalHeat = util.clamp((fam.federalHeat || 0) + gain - rules.federalHeatDecay, 0, 100);
        fam.smuggleVolume = Math.max(0, (fam.smuggleVolume || 0) * 0.85);
        if (fam.wiretapTicks > 0) fam.wiretapTicks--;

        // Telefon dinleme
        if (fam.federalHeat >= rules.federalWiretapThreshold && rng.chance(0.15)) {
          fam.wiretapTicks = Math.max(fam.wiretapTicks, rules.federalWiretapTicks);
          if (fam.isPlayer) report(state, rng, 'agency.wiretap', { agency: rng.pick(data.agencies).name, family: fam.name });
        }

        // Şafak operasyonu + varlık dondurma (yerel korumayı bypass)
        if (fam.federalHeat >= rules.federalRaidThreshold && rng.chance(0.2)) {
          const agency = rng.pick(data.agencies);
          const frozen = Math.round(fam.cleanMoney * rules.federalFreezeRate);
          fam.cleanMoney -= frozen;
          // Bakan ulusal düzeyde %30 tutuklamayı engelleyebilir (federal yine de el koyar)
          const blocked = fam.corruption && fam.corruption.minister && rng.chance(0.3);
          if (!blocked) {
            const famBoss = familyMembers(state, fam).find(c => c.role === 'BOSS' && c.status !== 'dead');
            const others = familyMembers(state, fam).filter(c => c.status === 'active' && c.role !== 'BOSS');
            const targetChar = (fam.federalHeat >= rules.federalBossArrestThreshold && famBoss) ? famBoss : (others[0] || famBoss);
            if (targetChar && !targetChar.isArrested) arrest(state, rng, targetChar, rng.int(rules.prisonSentenceMin, rules.prisonSentenceMax));
            fam.redNotice = true;
          }
          fam.federalHeat = util.clamp(fam.federalHeat - 30, 0, 100);
          if (fam.isPlayer) report(state, rng, 'agency.raid', { agency: agency.name, family: fam.name, amount: frozen });
        }
      });
    }
  }

  // Tutuklama: karaktere hapis durumu kurar
  function arrest(state, rng, c, months) {
    c.status = 'jailed'; c.isArrested = true;
    c.prison = { sentence: months, respect: 0, comfort: 0, guards: 0, recruits: [] };
    const fam = state.families[c.familyId];
    if (fam && fam.isPlayer) report(state, rng, 'arrest', { name: c.name, months });
  }

  // Tahliye: hapisten çıkar, devşirilen mahkumları ekibe katar
  function release(state, rng, c) {
    c.isArrested = false; c.status = 'active';
    const fam = state.families[c.familyId];
    if (fam && c.prison && c.prison.recruits.length) {
      c.prison.recruits.forEach(rid => {
        const r = state.characters[rid];
        if (r) { r.familyId = fam.id; r.status = 'active'; if (!fam.memberIds.includes(rid)) fam.memberIds.push(rid); }
      });
    }
    c.prison = null;
    if (fam && fam.isPlayer) report(state, rng, 'prison.release', { name: c.name });
  }

  // HAPİSHANE RPG — ceza sayacı + avlu olayları + tahliye
  class PrisonSystem {
    update(state, rng) {
      Object.values(state.characters).forEach(c => {
        if (!c.isArrested || !c.prison) return;
        c.prison.sentence -= 1;
        c.prison.respect = util.clamp(c.prison.respect + (rng.next() - 0.5) * 4, 0, 100);
        if (rng.chance(0.05)) { c.attributes.health = util.clamp(c.attributes.health - rng.int(2, 8), 0, 100); c.health = c.attributes.health; }
        // patron ömür boyu hapis → koltuk devri (varis dışarıda yönetir)
        if (c.id === state.dynasty.bossId && c.prison.sentence >= rules.lifeSentenceMonths && !state.flags.successionPending) {
          state.flags.successionPending = 1; state.flags.successionReason = 'life';
        }
        if (c.prison.sentence <= 0) release(state, rng, c);
      });
    }
  }

  // Oyuncunun hapisteki patronu (komutlar bunun üstünde çalışır)
  function playerArrestedBoss(state) {
    const b = state.characters[state.dynasty.bossId];
    return (b && b.isArrested && b.prison) ? b : null;
  }

  function doPrisonFight(state, rng) {
    const b = playerArrestedBoss(state); if (!b) return { ok: false, reason: 'not_in_prison' };
    const win = rng.next() < util.clamp(0.4 + b.skills.combat / 200 + b.courage / 300, 0.1, 0.9);
    if (win) { b.skills.combat = util.clamp(b.skills.combat + 3, 1, 100); b.prison.respect = util.clamp(b.prison.respect + 10, 0, 100); if (state.stats) state.stats.prisonFightsWon++; }
    else { b.attributes.health = util.clamp(b.attributes.health - rules.prisonFightHealthRisk, 0, 100); b.health = b.attributes.health; b.prison.respect = util.clamp(b.prison.respect - 3, 0, 100); }
    report(state, rng, 'prison.fight', { name: b.name, result: win ? 'üstün geldi' : 'yenildi' });
    return { ok: true, win, respect: b.prison.respect };
  }

  function doPrisonBribeGuard(state, rng) {
    const b = playerArrestedBoss(state); if (!b) return { ok: false, reason: 'not_in_prison' };
    const fam = playerFamily(state);
    if (totalMoney(fam) < rules.guardBribeCost) return { ok: false, reason: 'no_money' };
    payFrom(fam, rules.guardBribeCost);
    b.prison.guards = util.clamp(b.prison.guards + 1, 0, 10);
    b.prison.comfort = util.clamp(b.prison.comfort + 15, 0, 100);
    report(state, rng, 'prison.bribe', { name: b.name });
    return { ok: true, comfort: b.prison.comfort, guards: b.prison.guards };
  }

  function doPrisonRecruit(state, rng) {
    const b = playerArrestedBoss(state); if (!b) return { ok: false, reason: 'not_in_prison' };
    const chance = util.clamp(0.3 + b.skills.charisma / 200 + b.prison.respect / 200, 0.1, 0.9);
    if (rng.next() < chance) {
      const inmate = model.createCharacter(state, rng, null, 'ASSOCIATE');
      inmate.status = 'jailed';   // devşirildi; tahliyede ekibe katılacak
      state.characters[inmate.id] = inmate;
      b.prison.recruits.push(inmate.id);
      report(state, rng, 'prison.recruit', { name: b.name, recruit: inmate.name });
      return { ok: true, recruited: true, recruitId: inmate.id };
    }
    return { ok: true, recruited: false };
  }

  function doPrisonEscape(state, rng, method) {
    const b = playerArrestedBoss(state); if (!b) return { ok: false, reason: 'not_in_prison' };
    const fam = playerFamily(state);
    method = (method === 'bribe' || method === 'riot') ? method : 'tunnel';
    const lawyers = membersWithPerk(state, fam, 'legal').length;
    const hitmen = membersWithPerk(state, fam, 'combat').length;
    let base = 0.15 + b.attributes.intelligence / 300 + b.courage / 400 + b.prison.comfort / 300 + b.prison.guards * 0.03;
    if (method === 'bribe') base += lawyers * 0.12 + b.prison.guards * 0.05;        // sahte tahliye
    else if (method === 'riot') base += hitmen * 0.08 + b.prison.respect / 300;      // isyan
    else base += b.attributes.intelligence / 250;                                    // tünel
    const chance = util.clamp(base, 0.05, 0.92);
    if (rng.next() < chance) {
      release(state, rng, b);
      fam.federalHeat = util.clamp((fam.federalHeat || 0) + 20, 0, 100); fam.redNotice = true;
      if (state.stats) state.stats.escapes++;
      report(state, rng, 'prison.escape', { name: b.name, method });
      return { ok: true, escaped: true };
    }
    b.prison.sentence += rules.escapeBasePenalty;
    b.prison.respect = util.clamp(b.prison.respect - 5, 0, 100);
    if (method === 'riot') { b.attributes.health = util.clamp(b.attributes.health - 15, 0, 100); b.health = b.attributes.health; }
    report(state, rng, 'prison.escape.fail', { name: b.name });
    return { ok: true, escaped: false };
  }

  /* ----------------------------------------------------------------------
   * HANEDAN & VARİS — romantizm, genetik, succession, kaçış, endgame
   * -------------------------------------------------------------------- */
  // Varis genetiği: ebeveyn ortalaması + mutasyon
  function geneMix(a, b, rng) {
    const m = rules.geneticMutation;
    return util.clamp(Math.round((a + b) / 2 + rng.int(-m, m)), 1, 100);
  }

  function doMarry(state, rng) {
    const boss = state.characters[state.dynasty.bossId]; const fam = playerFamily(state);
    if (!boss || boss.status === 'dead') return { ok: false };
    if (boss.spouseId) return { ok: false, reason: 'married' };
    const spouse = model.createCharacter(state, rng, fam.id, 'ASSOCIATE');
    spouse.status = 'spouse'; spouse.age = util.clamp(boss.age + rng.int(-6, 6), 18, 70);
    spouse.spouseId = boss.id; state.characters[spouse.id] = spouse;
    boss.spouseId = spouse.id;
    report(state, rng, 'marry', { name: boss.name, spouse: spouse.name });
    return { ok: true, spouseId: spouse.id };
  }

  function doHaveChild(state, rng) {
    const boss = state.characters[state.dynasty.bossId]; const fam = playerFamily(state);
    if (!boss || !boss.spouseId) return { ok: false, reason: 'no_spouse' };
    const spouse = state.characters[boss.spouseId];
    const child = model.createCharacter(state, rng, fam.id, 'ASSOCIATE');
    child.status = 'child'; child.age = 0;
    child.parentIds = [boss.id, spouse ? spouse.id : null].filter(Boolean);
    // genetik aktarım
    child.attributes.intelligence = geneMix(boss.attributes.intelligence, spouse ? spouse.attributes.intelligence : 50, rng);
    child.attributes.looks = geneMix(boss.attributes.looks, spouse ? spouse.attributes.looks : 50, rng);
    child.skills.loyalty = geneMix(boss.skills.loyalty, spouse ? spouse.skills.loyalty : 50, rng);  // ekol sadakati yatkınlığı
    child.skills.combat = geneMix(boss.skills.combat, spouse ? spouse.skills.combat : 40, rng);
    child.skills.cunning = geneMix(boss.skills.cunning, spouse ? spouse.skills.cunning : 40, rng);
    child.psyche.stress = geneMix(boss.psyche.stress, spouse ? spouse.psyche.stress : 30, rng);     // psikolojik yatkınlık
    child.vitals.paranoia = geneMix(boss.vitals.paranoia, spouse ? spouse.vitals.paranoia : 10, rng);
    // kişilik özelliği (genetik eğilimli)
    let trait;
    if (child.attributes.intelligence > 75) trait = 'Dahi';
    else if (child.psyche.stress > 70 || child.vitals.paranoia > 70) trait = 'Psikopat';
    else if (child.skills.loyalty > 70) trait = 'Sadık';
    else if (child.skills.combat < 30) trait = 'Korkak';
    else trait = rng.pick(data.childTraits);
    child.traits = [trait];
    state.characters[child.id] = child;
    if (!fam.memberIds.includes(child.id)) fam.memberIds.push(child.id);
    boss.childrenIds.push(child.id);
    if (state.stats) state.stats.children++;
    report(state, rng, 'birth', { child: child.name, trait });
    return { ok: true, childId: child.id, trait };
  }

  function doSetHeir(state, charId) {
    const c = state.characters[charId]; const fam = playerFamily(state);
    if (!c || c.familyId !== fam.id || c.status === 'dead') return { ok: false };
    Object.values(state.characters).forEach(x => { if (x.familyId === fam.id) x.isHeir = false; });
    state.dynasty.heirs = [charId];
    c.isHeir = true;
    return { ok: true };
  }

  // Uygun varis bul: önce belirlenen, sonra reşit çocuk, sonra reşit üye
  function findHeir(state, fam) {
    const adult = id => { const c = state.characters[id]; return c && c.status !== 'dead' && c.id !== state.dynasty.bossId && c.age >= rules.childAdultAge && c.status !== 'child'; };
    for (const hid of state.dynasty.heirs) if (adult(hid)) return state.characters[hid];
    const boss = state.characters[state.dynasty.bossId];
    const kids = (boss ? boss.childrenIds : []).filter(adult).map(id => state.characters[id]);
    if (kids.length) return kids.sort((a, b) => b.attributes.intelligence - a.attributes.intelligence)[0];
    const members = fam.memberIds.map(id => state.characters[id]).filter(c => c && adult(c.id) && c.status === 'active');
    if (members.length) return members.sort((a, b) => (b.skills.loyalty + b.skills.management) - (a.skills.loyalty + a.skills.management))[0];
    return null;
  }

  function performSuccession(state, rng) {
    const fam = playerFamily(state); if (!fam) return;
    const oldBoss = state.characters[state.dynasty.bossId];
    const reason = state.flags.successionReason || 'death';
    // ölen/devredilen patron için tarih bölümü yaz
    if (oldBoss) {
      const ch = state.dynasty.history[state.dynasty.history.length - 1];
      if (ch) { ch.endedYear = state.clock.year; ch.fate = reason; ch.peakWealth = Math.max(ch.peakWealth || 0, totalMoney(fam)); }
    }
    const heir = findHeir(state, fam);
    state.flags.successionPending = 0; state.flags.successionReason = null;
    if (!heir) {
      state.dynasty.collapsed = true; state.flags.gameOver = 1;
      report(state, rng, 'collapse', {});
      return;
    }
    // miras: nakit/işletme/mülk aile düzeyinde kalır; itibar ve ilişkiler aşınır
    heir.role = 'BOSS'; heir.isHeir = false; heir.isArrested = false; heir.prison = null; heir.status = 'active';
    state.dynasty.bossId = heir.id;
    state.dynasty.generation += 1;
    fam.reputation = Math.round(fam.reputation * rules.successionRepLoss);
    Object.keys(fam.relations).forEach(id => { fam.relations[id].standing = Math.round(fam.relations[id].standing * rules.successionStandingLoss); });
    state.dynasty.history.push({ generation: state.dynasty.generation, bossName: heir.name, startedYear: state.clock.year, peakWealth: totalMoney(fam), note: 'Koltuğu devraldı.' });
    const tpl = reason === 'insane' ? 'succession.insane' : reason === 'life' ? 'succession.life' : 'succession';
    report(state, rng, tpl, { heir: heir.name, boss: oldBoss ? oldBoss.name : '—', gen: state.dynasty.generation });
  }

  // Uluslararası kaçış: rüşvetle başka ülkeye geç (redNotice + iade riski)
  function doFleeCountry(state, rng, havenName) {
    const fam = playerFamily(state); const boss = state.characters[state.dynasty.bossId];
    const haven = data.havens.find(h => h.name === havenName) || rng.pick(data.havens);
    const bribe = Math.round(totalMoney(fam) * rules.escapeBribeRate);
    if (totalMoney(fam) < bribe + 1000) return { ok: false, reason: 'no_money' };
    payFrom(fam, bribe);
    // kırmızı bülten + iade anlaşması olan ülke → yakalanma riski
    if (fam.redNotice && haven.extradition && rng.chance(0.5)) {
      if (boss && !boss.isArrested) arrest(state, rng, boss, rng.int(rules.prisonSentenceMin, rules.prisonSentenceMax));
      report(state, rng, 'escape.caught', { name: boss ? boss.name : fam.name, country: haven.name });
      return { ok: true, caught: true };
    }
    fam.country = haven.name; fam.city = haven.name; fam.inExile = true;
    fam.heat = util.clamp(fam.heat - 40, 0, 100); fam.federalHeat = util.clamp((fam.federalHeat || 0) - 30, 0, 100);
    if (state.stats) state.stats.escapes++;
    report(state, rng, 'escape.country', { name: boss ? boss.name : fam.name, country: haven.name });
    return { ok: true, caught: false, bribe };
  }

  // Dynasty Score (servet + bölge + politik güç + sadakat + nesil)
  function dynastyScore(state) {
    const fam = playerFamily(state); if (!fam) return 0;
    return Math.round(totalMoney(fam) / 10000 + fam.territoryIds.length * 5 + corruptionLevel(fam) * 2 + avgLoyalty(state, fam) + state.dynasty.generation * 20 + (state.stats ? state.stats.assassinations * 3 : 0));
  }

  const achievementHelpers = { totalMoney, player: playerFamily, corruptionLevel, alliesOf, familyMembers };

  // 100+ başarım: açık + eşik serisi üreteçleri (cond saf predicate, state'e yazılmaz)
  function buildAchievements() {
    const A = [];
    const add = (id, name, cat, cond) => A.push({ id, name, cat, cond });
    const P = s => playerFamily(s);
    // servet eşikleri

  data.achievements = buildAchievements();

  // BAŞARIM & ENDGAME sistemi (performans dostu: yalnız kilitli olanları kontrol eder)
  class AchievementSystem {
    update(state, rng) {
      const unlocked = state.achievements.unlocked;
      for (const a of data.achievements) {
        if (unlocked[a.id]) continue;
        let ok = false;
        try { ok = a.cond(state, achievementHelpers); } catch (e) { ok = false; }
        if (ok) { unlocked[a.id] = state.clock.tick; if (a.cat !== 'endgame') report(state, rng, 'achievement', { name: a.name }); else report(state, rng, 'endgame', { name: a.name }); }
      }
      // zafer: tüm endgame hedefleri
      if (!state.flags.victory && data.endgameGoals.every(g => unlocked['endgame_' + g.id])) {
        state.flags.victory = 1; report(state, rng, 'victory', {});
      }
    }
  }

  // HANEDAN sistemi: succession tetikleri + zirve servet kaydı
  class DynastySystem {
    update(state, rng) {
      if (state.flags.successionPending && !state.dynasty.collapsed) performSuccession(state, rng);
      const fam = playerFamily(state);
      if (fam && state.stats) state.stats.peakWealth = Math.max(state.stats.peakWealth, totalMoney(fam));
    }
  }

  const crewSystem = new CrewSystem();
  const moleSystem = new MoleSystem();
  const diplomacySystem = new DiplomacySystem();
  const agencySystem = new AgencySystem();
  const prisonSystem = new PrisonSystem();
  const dynastySystem = new DynastySystem();
  const achievementSystem = new AchievementSystem();
  // Living World tick'ine kaydet (saf fonksiyon imzasıyla)
  systems.crew = (state, rng) => crewSystem.update(state, rng);
  systems.mole = (state, rng) => moleSystem.update(state, rng);
  systems.diplomacy = (state, rng) => diplomacySystem.update(state, rng);
  systems.agency = (state, rng) => agencySystem.update(state, rng);
  systems.prison = (state, rng) => prisonSystem.update(state, rng);
  systems.dynasty = (state, rng) => dynastySystem.update(state, rng);
  systems.achievement = (state, rng) => achievementSystem.update(state, rng);

  // Oyuncu komutları (deterministik, rngState'i ilerletir; aktör = oyuncu ailesi)
  const commands = {
    hire: (state, opts) => withRng(state, rng => crewSystem.hire(state, rng, playerFamily(state).id, opts)),
    fire: (state, charId) => withRng(state, rng => crewSystem.fire(state, rng, playerFamily(state).id, charId)),
