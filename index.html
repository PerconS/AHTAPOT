  <style>
    /* ===================================================================
     * AHTAPOT — Faz 3 Mobil UI · Tema: Cyber Crimson / Mafia Noir
     * =================================================================== */
    :root {
      --bg:#0a0505; --bg2:#120c0c; --panel:rgba(24,15,15,0.72); --panel2:rgba(34,20,20,0.6);
      --line:#2c1b1b; --line2:#3a2424;
      --red:#ff0033; --red-dim:#b3122e; --gold:#d4af37; --green:#00ff66;
      --fg:#ece6e0; --muted:#9b8f88; --dim:#6d635d;
      --shadow:0 8px 30px rgba(0,0,0,0.55);
    }
    * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    html,body { margin:0; padding:0; height:100%; }
    body {
      background:
        radial-gradient(1200px 600px at 50% -10%, #1a0c0c 0%, transparent 60%),
        radial-gradient(800px 500px at 80% 110%, #160a12 0%, transparent 55%),
        linear-gradient(180deg, var(--bg) 0%, #070303 100%);
      color:var(--fg);
      font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, Roboto, sans-serif;
      display:flex; justify-content:center; align-items:stretch;
      min-height:100dvh; overscroll-behavior:none;
    }
    /* Telefon çerçevesi — masaüstünde ortalı, max 480px */
    #app {
      width:100%; max-width:480px; height:100dvh; display:flex; flex-direction:column;
      background:linear-gradient(180deg,#0c0606,#080404); position:relative; overflow:hidden;
      box-shadow:0 0 0 1px var(--line), var(--shadow);
    }
    @media (min-width:520px){ #app { height:calc(100dvh - 24px); margin:12px 0; border-radius:22px; } }

    /* ---------- Üst Stat Paneli ---------- */
    #topbar { flex:0 0 auto; padding:calc(8px + env(safe-area-inset-top)) 12px 8px; background:linear-gradient(180deg,rgba(20,10,10,0.95),rgba(14,7,7,0.85));
      backdrop-filter:blur(8px); border-bottom:1px solid var(--line); z-index:5; }
    .tb-row1 { display:flex; align-items:center; gap:8px; margin-bottom:8px; }
    .tb-name { font-weight:700; font-size:14px; letter-spacing:.5px; flex:1; min-width:0;

    .rank-chip { font-size:10px; font-weight:700; color:#1a1206; background:linear-gradient(180deg,#e8c75a,var(--gold));

    .bar.para > i { background:linear-gradient(90deg,#7a3cff,#c026d3); }

    /* ---------- Görünüm alanı ---------- */
    #view { flex:1 1 auto; overflow-y:auto; overflow-x:hidden; padding:12px 12px 16px;
      -webkit-overflow-scrolling:touch; }
    .view-title { font-size:11px; color:var(--gold); text-transform:uppercase; letter-spacing:2px;
      margin:2px 0 10px; font-weight:700; }
    .card { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:12px;
      margin-bottom:10px; backdrop-filter:blur(6px); box-shadow:0 2px 12px rgba(0,0,0,.35); }
    .card h3 { margin:0 0 9px; font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:1px;

    .row { display:flex; justify-content:space-between; align-items:center; gap:8px; padding:5px 0; font-size:13px; }

    .muted { color:var(--muted); } .dim { color:var(--dim); font-size:11px; }
    .red { color:var(--red); } .gold { color:var(--gold); } .green { color:var(--green); }

    .btn.gold { background:linear-gradient(180deg,#e8c75a,var(--gold)); border-color:#f0d97a; color:#1a1206; }
    .btn.ghost { background:transparent; }
    .btn.sm { min-height:36px; padding:7px 10px; font-size:11.5px; width:auto; }
    .btn:disabled { opacity:.4; filter:grayscale(.6); }
    .btn-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
    .btn-grid.c3 { grid-template-columns:1fr 1fr 1fr; }
    .actions { display:flex; gap:6px; flex-wrap:wrap; }

    /* Sürgün/banner */
    .banner { border-radius:11px; padding:9px 11px; font-size:11.5px; margin-bottom:10px; border:1px solid; }
    .banner.danger { background:rgba(255,0,51,.08); border-color:var(--red-dim); color:#ff7a90; }
    .banner.gold { background:rgba(212,175,55,.08); border-color:var(--gold); color:#ecd98a; }

    /* Haber akışı */
    .feed div { font-size:11.5px; padding:6px 0; border-bottom:1px dashed var(--line); color:var(--fg); line-height:1.45; }
    .feed div:last-child { border-bottom:0; }

    /* Başarım galerisi */
    .ach-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
    .ach { border:1px solid var(--line); border-radius:11px; padding:9px; background:var(--panel2); }
    .ach.on { border-color:var(--gold); background:linear-gradient(180deg,rgba(212,175,55,.12),rgba(212,175,55,.03)); box-shadow:0 0 12px rgba(212,175,55,.15); }
    .ach .n { font-size:11px; font-weight:700; } .ach.on .n { color:var(--gold); }

    #advancebar { flex:0 0 auto; padding:8px 12px; background:linear-gradient(180deg,transparent,rgba(8,4,4,.9));

    .navbtn.alert { color:var(--gold); }
    .navbtn.alert .i { filter:drop-shadow(0 0 6px var(--gold)); }

    /* Modal & Toast (alert YOK) */
    #overlay { position:absolute; inset:0; background:rgba(5,2,2,.78); backdrop-filter:blur(4px);
      display:none; align-items:center; justify-content:center; padding:20px; z-index:50; }
    #overlay.on { display:flex; }
    .modal { width:100%; max-width:380px; background:linear-gradient(180deg,#1c1010,#140a0a); border:1px solid var(--line2);

      transition:opacity .25s, transform .25s; z-index:60; box-shadow:var(--shadow); }
    #toast.on { opacity:1; transform:translateX(-50%) translateY(0); }
    #toast.ok { border-color:#0a6; } #toast.bad { border-color:var(--red-dim); }
    #toast.gold { border-color:var(--gold); color:var(--gold); }

    /* Splash */
    #splash { position:absolute; inset:0; z-index:80; display:flex; flex-direction:column;
      align-items:center; justify-content:center; gap:14px; background:radial-gradient(circle at 50% 40%,#1a0a0a,#070303);
      transition:opacity .6s; }
    #splash.hide { opacity:0; pointer-events:none; }
    #splash .logo { font-size:40px; font-weight:800; letter-spacing:6px; color:var(--red);
      text-shadow:0 0 24px rgba(255,0,51,.6); }
    #splash .tag { font-size:11px; color:var(--gold); letter-spacing:3px; text-transform:uppercase; }
    .input { width:100%; min-height:42px; background:#160c0c; border:1px solid var(--line2); border-radius:10px;
      color:var(--fg); padding:8px 10px; font-family:inherit; font-size:13px; }
    select.input { appearance:none; -webkit-appearance:none; background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%); background-position:calc(100% - 14px) 18px,calc(100% - 9px) 18px; background-size:5px 5px,5px 5px; background-repeat:no-repeat; }

    /* ---------- Cila: geçiş & animasyonlar ---------- */
    @keyframes fadeIn { from{opacity:0} to{opacity:1} }
    @keyframes popIn { from{opacity:0; transform:translateY(14px) scale(.96)} to{opacity:1; transform:translateY(0) scale(1)} }
    @keyframes viewSwap { from{opacity:0; transform:translateX(14px)} to{opacity:1; transform:translateX(0)} }
    #overlay.on { animation:fadeIn .18s ease; }
    #overlay.on .modal { animation:popIn .26s cubic-bezier(.2,.9,.3,1.2); }
    #view.swap { animation:viewSwap .24s ease; }
    .navbtn:active { transform:scale(.92); }
    /* mobil dokunma akıcılığı */
    button, a, .navbtn { touch-action:manipulation; }
    #view, #nav { -webkit-overflow-scrolling:touch; }
    @media (prefers-reduced-motion:reduce){ *{animation:none !important; transition:none !important;} }

<script id="ahtapot-core">
/* =========================================================================
 * AHTAPOT — Çekirdek Simülasyon (Faz 1)
 * Tek dosya, vanilla ES6+, sıfır bağımlılık. DOM'a dokunmaz (UI ayrı, faz 3).
 * Node altında da çalışır (self-test / headless denge analizi).
 * ========================================================================= */
(function () {
  'use strict';
  const root = (typeof globalThis !== 'undefined') ? globalThis : this;

  /* ----------------------------------------------------------------------
   * util — RNG (deterministik), id üretimi, matematik, checksum
   * -------------------------------------------------------------------- */
  const util = (() => {
    function clamp(v, lo, hi) { return v < lo ? lo : v > hi ? hi : v; }

    // mulberry32: 32-bit state, tek tam sayıyla serileştirilebilir → save dostu
    function makeRng(seed) {
      let s = seed >>> 0;
      return {
        get state() { return s; },
        set state(v) { s = v >>> 0; },
        next() {
          s = (s + 0x6d2b79f5) | 0;
          let t = Math.imul(s ^ (s >>> 15), 1 | s);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        },
        int(min, max) { return min + Math.floor(this.next() * (max - min + 1)); },
        chance(p) { return this.next() < p; },
        pick(arr) { return arr[Math.floor(this.next() * arr.length)]; },
        pickN(arr, n) {
          const copy = arr.slice(); const out = [];
          while (out.length < n && copy.length) out.push(copy.splice(Math.floor(this.next() * copy.length), 1)[0]);
          return out;
        },
      };
    }

    // FNV-1a 32-bit: save bütünlüğü için hafif checksum
    function fnv1a(str) {
      let h = 0x811c9dc5;
      for (let i = 0; i < str.length; i++) {
        h ^= str.charCodeAt(i);
        h = Math.imul(h, 0x01000193);
      }
      return (h >>> 0).toString(16);
    }

    function avg(nums) { return nums.length ? nums.reduce((a, b) => a + b, 0) / nums.length : 0; }

    return { clamp, makeRng, fnv1a, avg };
  })();

  /* ----------------------------------------------------------------------
   * rules — denge sabitleri (data-driven; kod değişmeden tuning)
   * -------------------------------------------------------------------- */
  const rules = {
    version: 1,
    start: { clean: 6000, dirty: 0 },     // [balans] biraz daha yumuşak açılış
    salary: { BOSS: 0, UNDERBOSS: 450, CAPO: 280, SOLDIER: 140, ASSOCIATE: 75 },
    launderCut: 0.12,                     // [balans] aklama daha akıcı
    heatDecayPerTick: 0.4,
    raidHeatThreshold: 65,
    raidChancePerTick: 0.12,
    eventLogMax: 250,
    newsFeedMax: 40,
    aiFamilyCount: 4,
    territoryCount: 12,
    monthsPerYear: 12,            // tick = 1 ay; "Yaş Al" = 1 yıl = 12 tick
    aiOpBaseChance: 0.06,
    startAge: 14,                 // BitLife tarzı genç başlangıç
    deathAgeBase: 72,             // doğal ölüm eşiği etrafı (rng ile sapar)
    healthDeclineAge: 50,         // bu yaştan sonra sağlık düşüşü hızlanır
    paranoiaHallucThreshold: 70,  // bu üstünde halüsinasyon/sahte ihanet riski
    paranoiaHallucChance: 0.12,
    // --- Ekip sistemi ---
    crewLimitBase: 8,             // rütbe 0'da ekip limiti (başlangıç 5 üyenin üstünde marj)
    crewLimitPerRank: 2,          // her rütbe +2 üye
    jobSalary: { none: 0, accountant: 400, hitman: 350, bodyguard: 300, lawyer: 600, spy: 450, ops_chief: 700 },
    hireCostBase: 1500,           // işe alım maliyeti (rütbeyle artar)
    // --- Köstebek sistemi ---
    moleRiskGrowth: 0.8,          // tick başına temel köstebek riski büyümesi (düşük sadakatte)
    moleConvertThreshold: 60,     // bu riskin üstünde köstebek olma RNG kontrolü
    moleActChance: 0.25,          // köstebek aktif olduğunda eylem yapma şansı
    surveilCost: 800, loyaltyTestCost: 1200,  // oyuncu eylem maliyetleri
    // --- Diplomasi & savaş ---
    warBattleChancePerTick: 0.35, // savaştaki aileler arası tick başına çatışma şansı
    warLuckSpread: 0.18,          // [balans] underdog sürprizleri biraz daha mümkün
    aiDiploChance: 0.08,          // AI'ın tick başına diplomatik hamle şansı
    embargoIncomePenalty: 0.25,   // ambargo altındaki ailenin ticaret/gelir cezası
    // --- Dinamik piyasa & kaçak ticaret ---
    marketReversion: 0.10,        // fiyatın hedefe geri dönüş hızı (mean-reversion)
    tradeBustHeatThreshold: 0.0,  // ticaret bust'ı her zaman olası
    tradeBustHeat: 10,            // ticaret yakalanırsa eklenen ısı
    accountantLaunderBoost: 0.25, // Muhasebeci başına aklama kapasitesi artışı
    auditFineRate: 0.10,          // denetimde temiz paranın kesilen oranı
    auditPolicePressureBase: 0.5, // denetim riskinde polis baskısı taban katsayısı
    // --- Siyasi yozlaşma ---
    corruptionHeatSuppress: 0.03, // yozlaşma seviyesi başına tick'te ısı bastırma
    corruptionAuditDivisor: 150,  // denetim riskini bastıran yozlaşma böleni
    corruptionRaidDivisor: 130,   // baskın şansını bastıran yozlaşma böleni
    leakSeizeReduction: 0.4,      // sızdırılan baskında el konan paranın çarpanı
    courtReleaseDivisor: 250,     // yozlaşmayla hapisten salınma şansı böleni
    // --- İstihbarat kurumları (federal) ---
    federalCorruptionTrigger: 50, // bu üstü yozlaşma federal dikkat çeker
    federalSmuggleDivisor: 80,    // [balans] makul kaçakçılık feds tetiklemesin
    federalHeatDecay: 1.8,        // [balans] federal ısı daha çabuk soğur
    federalWiretapThreshold: 42,  // telefon dinleme eşiği
    federalRaidThreshold: 65,     // [balans] şafak operasyonu / varlık dondurma eşiği
    federalBossArrestThreshold: 80, // bu üstünde patron bizzat tutuklanır
    federalFreezeRate: 0.25,      // dondurulan temiz banka oranı
    federalWiretapTicks: 6,       // dinleme süresi (ay)
    // --- Hapishane RPG ---
    prisonSentenceMin: 6, prisonSentenceMax: 24,  // ceza (ay)
    prisonFightHealthRisk: 12,    // ring dövüşü kaybında sağlık kaybı
    guardBribeCost: 5000,         // gardiyan rüşveti
    escapeBasePenalty: 8,         // başarısız firarda eklenen ceza (ay)
    // --- Hanedan & varis genetiği ---
    geneticMutation: 12,          // çocuk özniteliklerinde ±mutasyon aralığı
    childAdultAge: 16,            // bu yaşta çocuk aktif üyeye dönüşür
    successionRepLoss: 0.7,       // koltuk devrinde itibar çarpanı
    successionStandingLoss: 0.8,  // koltuk devrinde rakip ilişki çarpanı
    insanityParanoiaThreshold: 99,// kalıcı delilik eşiği
    lifeSentenceMonths: 200,      // bu cezadan sonra ömür boyu sayılır (devir)
    // --- Uluslararası kaçış ---
    escapeBribeRate: 0.2,         // kaçışta servetten verilen rüşvet oranı
    exileIncomePenalty: 0.4,      // sürgündeyken haraç geliri cezası
  };

  /* ----------------------------------------------------------------------
   * data — katalog + isim havuzları + anlatı şablonları
   * -------------------------------------------------------------------- */
  const data = {
    crimeTypes: [
      { id: 'extortion', name: 'Haraç', baseRisk: 0.15, rewardMin: 300, rewardMax: 900, heat: 4, skills: ['charisma', 'combat'], duration: 3 },
      { id: 'loan', name: 'Tefecilik', baseRisk: 0.12, rewardMin: 200, rewardMax: 600, heat: 2, skills: ['charisma'], duration: 4 },
      { id: 'smuggling', name: 'Kaçakçılık', baseRisk: 0.35, rewardMin: 1200, rewardMax: 4000, heat: 9, skills: ['cunning', 'management'], duration: 6 },
      { id: 'heist', name: 'Soygun', baseRisk: 0.55, rewardMin: 4000, rewardMax: 12000, heat: 18, skills: ['cunning', 'combat'], duration: 8 },
      { id: 'hit', name: 'Suikast', baseRisk: 0.6, rewardMin: 0, rewardMax: 0, heat: 22, skills: ['combat', 'cunning'], duration: 5 },
    ],
    // İşletmeler — kara para aklama cepheleri (personel/denetim/verim ile)
    businessTypes: [
      { id: 'carwash', name: 'Oto Yıkama', income: 300, launder: 1000, cover: 0.45, staff: 120, audit: 0.04, eff: 0.85, cost: 12000 },
      { id: 'restaurant', name: 'Lüks Restoran', income: 600, launder: 1500, cover: 0.50, staff: 350, audit: 0.05, eff: 0.82, cost: 25000 },
      { id: 'club', name: 'Gece Kulübü', income: 900, launder: 2200, cover: 0.55, staff: 400, audit: 0.07, eff: 0.80, cost: 40000 },
